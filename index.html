const _flashCache=new Map();
function flashOf(img){let m=_flashCache.get(img);if(!m){m=whiteMask(img);_flashCache.set(img,m);}return m;}
const TYPE_LBL={slash:'cięte',pierce:'kłute',blunt:'obuchowe',fire:'ogień',dark:'mrok'};

class BattleScene{
  constructor(group,opts){
    this.opts=opts;this.t=0;this.state='intro';this.parts=[];this.floats=[];this.msg=null;
    this.heroes=G.party.map((h,i)=>({kind:'hero',h,id:h.id,pose:h.hp>0?'idle':'ko',poseT:0,offX:0,offTX:0,flash:0,
      x:354+i*20,y:64+i*34,guarding:false}));
    this.foes=group.map((id,i)=>{
      const d=ENEMIES[id];G.bestiary[id]=true;
      const spr=IMG.enemies[id];
      const n=group.length;
      const fx=n===1?96:54+(i%2)*48+i*4,fy=n===1?104:74+i*(56/Math.max(1,n-1));
      return{kind:'foe',id,d,hp:d.hp,maxHp:d.hp,buffs:{},status:{},spr,scale:d.spr.scale||2,
        pose:'idle',offX:0,offTX:0,flash:0,dying:0,phased:false,acts:d.acts,
        x:fx,y:fy,guarding:false};
    });
    for(const hu of this.heroes){hu.h.buffs={};} // świeże mnożniki na start walki
    this.queue=[];this.cur=null;this.cmd=0;this.ti=0;this.subMenu=null;this.si=0;
    this.co=null;this.wait=0;
    AudioSys.music(opts.music||'battle');
  }
  // ---- statystyki z mnożnikami ----
  uStat(u,k){
    let v=u.kind==='hero'?hstat(u.h,k):u.d[k];
    const b=(u.kind==='hero'?u.h.buffs:u.buffs)[k];
    if(b)v*=b.mul;
    if(k==='atk'&&this.uStatus(u).fear)v*=.75;
    return Math.max(1,Math.round(v));
  }
  uStatus(u){return u.kind==='hero'?u.h.status:u.status;}
  uHp(u){return u.kind==='hero'?u.h.hp:u.hp;}
  uMaxHp(u){return u.kind==='hero'?hstat(u.h,'hp'):u.maxHp;}
  setHp(u,v){
    v=clamp(v,0,this.uMaxHp(u));
    if(u.kind==='hero')u.h.hp=v;else u.hp=v;
  }
  alive(u){return this.uHp(u)>0&&!u.dying;}
  aliveFoes(){return this.foes.filter(u=>this.alive(u));}
  aliveHeroes(){return this.heroes.filter(u=>this.alive(u));}
  // ---- przebieg tur ----
  nextTurn(){
    if(!this.aliveFoes().length){this.startCo(this.winSeq());return;}
    if(!this.aliveHeroes().length){this.startCo(this.loseSeq());return;}
    if(!this.queue.length){
      const all=this.heroes.concat(this.foes).filter(u=>this.alive(u));
      this.queue=all.map(u=>({u,ini:this.uStat(u,'spd')*rnd.range(.85,1.2)})).sort((a,b)=>b.ini-a.ini).map(e=>e.u);
    }
    const u=this.queue.shift();
    if(!this.alive(u)){this.nextTurn();return;}
    u.guarding=false;this.cur=u;
    const st=this.uStatus(u);
    if(st.stun){
      st.stun--;if(st.stun<=0)delete st.stun;
      this.say((u.kind==='hero'?HEROES[u.id].name:u.d.name)+' nie może się ruszyć!');
      this.startCo(this.endTurnSeq(u));return;
    }
    if(u.kind==='hero'){this.state='menu';this.cmd=0;this.subMenu=null;}
    else this.startCo(this.foeAct(u));
  }
  startCo(gen){this.co=gen;this.wait=0;this.state='anim';}
  say(s){this.msg={text:s,t:2.2};}
  // ---- obrażenia ----
  dmgRoll(att,tgt,pow,type,o={}){
    const atk=this.uStat(att,'atk'),def=this.uStat(tgt,'def')*(o.pierceDef?(1-o.pierceDef):1);
    let dmg=atk*2*pow*rnd.range(.92,1.08)-def*1.1;
    const res=tgt.kind==='foe'?(tgt.d.res||{}):{};
    const mult=res[type]!==undefined?res[type]:1;
    dmg*=mult;
    let crit=false;
    const cch=.05+this.uStat(att,'dex')*.006+(o.critUp||0);
    if(rnd.chance(cch)){dmg*=1.7;crit=true;}
    if(tgt.guarding)dmg*=.5;
    return{dmg:Math.max(1,Math.round(dmg)),crit,mult};
  }
  addFloat(x,y,s,c){this.floats.push({x,y,txt:s,c,t:1.1,vy:-26});}
  spawnParts(type,x,y){
    const defs={hit:['#e8e0d0','#c9a35a',8,90],blood:['#8a2f26','#5e1a14',7,60],fire:['#e89030','#d06018',10,70],
      heal:['#7ad08a','#3e6e52',8,-40],buff:['#e8d050','#c9a35a',7,-30],dark:['#6a4a8a','#3a2a4a',9,40]};
    const[c1,c2,n,sp]=defs[type]||defs.hit;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,v=Math.random()*Math.abs(sp)+20;
      this.parts.push({x,y,vx:Math.cos(a)*v,vy:sp<0?-v*.8:Math.sin(a)*v-30,c:Math.random()<.5?c1:c2,t:.5+Math.random()*.3,g:sp<0?-20:160,lum:type==='fire'||type==='heal'||type==='buff'});
    }
  }
  hitFX(tgt,type,crit){
    tgt.flash=1;
    const px=tgt.x+(tgt.kind==='foe'?tgt.spr.w*tgt.scale/2:30),py=tgt.y+20;
    this.spawnParts(type==='fire'?'fire':(type==='dark'?'dark':(tgt.kind==='foe'&&tgt.d.spr.gen!=='human'?'hit':'blood')),px,py);
    if(crit){shake(5);AudioSys.sfx('crit');}
    else{shake(2);AudioSys.sfx(type==='fire'?'fire':(type==='dark'?'dark':'hit'));}
  }
  applyHit(att,tgt,pow,type,o={}){
    const r=this.dmgRoll(att,tgt,pow,type,o);
    this.setHp(tgt,this.uHp(tgt)-r.dmg);
    this.hitFX(tgt,type,r.crit);
    const px=tgt.x+(tgt.kind==='foe'?tgt.spr.w*tgt.scale/2:30);
    this.addFloat(px,tgt.y+4,r.dmg+(r.crit?'!':''),r.crit?'#f0d050':(r.mult>1?'#8ad07a':(r.mult<1?'#8d8270':'#e8dcc0')));
    if(o.status&&rnd.chance(o.ch||o.statusCh||0)){
      const st=this.uStatus(tgt);
      st[o.status]=(o.status==='stun')?1:3;
      this.addFloat(px,tgt.y-6,STATUS_LBL[o.status]+'!','#c08ad8');
    }
    if(this.uHp(tgt)<=0)this.kill(tgt);
    return r;
  }
  kill(u){
    if(u.kind==='foe'){u.dying=1;AudioSys.sfx('death');}
    else{u.pose='ko';this.say(HEROES[u.id].name+' pada!');AudioSys.sfx('death');}
  }
  // ---- AI wroga ----
  *foeAct(u){
    yield .35;
    // faza bossa
    const d=u.d;
    if(d.phase&&!u.phased&&u.hp/u.maxHp<=d.phase.at){
      u.phased=true;u.acts=d.phase.acts;
      if(d.phase.buff)for(const k in d.phase.buff)u.buffs[k]={mul:d.phase.buff[k],turns:99};
      this.say(d.phase.say);flash('#8a2f26',.8);shake(6);AudioSys.sfx('dark');
      yield 1.4;
    }
    const pool=u.acts;let sum=0;for(const a of pool)sum+=a.w;
    let roll=rnd.f()*sum,act=pool[0];
    for(const a of pool){roll-=a.w;if(roll<=0){act=a;break;}}
    if(act.name)this.say(d.name+': '+act.name);
    if(act.kind==='guard'){u.guarding=true;AudioSys.sfx('buff');yield .5;yield* this.endTurnSeq(u);return;}
    if(act.kind==='buff'){
      for(const k in act.buff)u.buffs[k]={mul:act.buff[k],turns:act.dur||3};
      this.spawnParts('buff',u.x+u.spr.w*u.scale/2,u.y+10);AudioSys.sfx('buff');yield .6;yield* this.endTurnSeq(u);return;
    }
    if(act.kind==='heal'){
      const v=Math.round(u.maxHp*act.pow);this.setHp(u,u.hp+v);
      this.addFloat(u.x+u.spr.w*u.scale/2,u.y,'+'+v,'#7ad08a');
      this.spawnParts('heal',u.x+u.spr.w*u.scale/2,u.y+10);AudioSys.sfx('heal');yield .6;yield* this.endTurnSeq(u);return;
    }
    // atak
    const tgts=act.target==='all'?this.aliveHeroes():[rnd.pick(this.aliveHeroes())];
    u.pose='attack';u.offTX=26;yield .22;
    for(const t of tgts){
      this.applyHit(u,t,act.pow,act.type,{status:act.status,ch:act.ch,critUp:act.critUp});
      if(this.alive(t)){t.pose='hurt';t.poseT=.4;}
      if(act.debuff)for(const k in act.debuff)(t.h.buffs)[k]={mul:act.debuff[k],turns:act.dur||3};
    }
    yield .3;u.pose='idle';u.offTX=0;yield .35;
    yield* this.endTurnSeq(u);
  }
  // ---- akcje bohatera ----
  *heroAttack(u,tgt,skill,item){
    this.subMenu=null;
    if(item){
      const it=ITEMS[item];remItem(item);
      this.say(HEROES[u.id].name+': '+it.name);
      u.pose='use';yield .4;
      if(it.dmg){
        const tgts=it.target==='enemies'?this.aliveFoes():[tgt];
        for(const t of tgts){
          const dmg=Math.round(it.dmg*rnd.range(.9,1.1)*((t.d.res||{})[it.dmgType]!==undefined?t.d.res[it.dmgType]:1));
          this.setHp(t,this.uHp(t)-dmg);this.hitFX(t,it.dmgType,false);
          this.addFloat(t.x+t.spr.w*t.scale/2,t.y+4,dmg+'','#e8a050');
          if(it.dmgType==='fire'&&rnd.chance(.4)){this.uStatus(t).burn=3;}
          if(this.uHp(t)<=0)this.kill(t);
        }
      }
      if(it.heal){this.setHp(tgt,this.uHp(tgt)+it.heal);this.addFloat(tgt.x+24,tgt.y,'+'+it.heal,'#7ad08a');this.spawnParts('heal',tgt.x+30,tgt.y+16);AudioSys.sfx('heal');}
      if(it.spRest&&tgt.kind==='hero'){tgt.h.sp=Math.min(hstat(tgt.h,'sp'),tgt.h.sp+it.spRest);this.addFloat(tgt.x+24,tgt.y,'+'+it.spRest+' wg','#6aa0d8');AudioSys.sfx('heal');}
      if(it.cure&&tgt.kind==='hero')for(const c of it.cure)delete tgt.h.status[c];
      if(it.revive&&tgt.kind==='hero'&&tgt.h.hp<=0){tgt.h.hp=Math.max(1,Math.round(hstat(tgt.h,'hp')*it.revive));tgt.pose='idle';this.spawnParts('heal',tgt.x+30,tgt.y+16);AudioSys.sfx('heal');}
      if(it.buff&&tgt.kind==='hero')for(const k in it.buff){tgt.h.buffs[k]={mul:it.buff[k],turns:it.dur||3};this.spawnParts('buff',tgt.x+30,tgt.y+10);}
      u.pose='idle';yield .45;
      yield* this.endTurnSeq(u);return;
    }
    if(skill){
      const s=SKILLS[skill];u.h.sp-=s.sp;
      this.say(HEROES[u.id].name+': '+s.name);
      if(s.heal!==undefined||s.revive||s.cure||s.buff||s.debuff){
        u.pose=s.debuff?'attack':'use';yield .45;
        if(s.target==='allies'){for(const t of this.aliveHeroes()){for(const k in(s.buff||{}))t.h.buffs[k]={mul:s.buff[k],turns:s.dur||3};this.spawnParts('buff',t.x+30,t.y+10);}AudioSys.sfx('buff');}
        else if(s.target==='enemies'&&s.debuff){for(const t of this.aliveFoes()){for(const k in s.debuff)t.buffs[k]={mul:s.debuff[k],turns:s.dur||3};this.spawnParts('dark',t.x+t.spr.w*t.scale/2,t.y+10);}AudioSys.sfx('dark');}
        else if(s.target==='self'){for(const k in(s.buff||{}))u.h.buffs[k]={mul:s.buff[k],turns:s.dur||3};this.spawnParts('buff',u.x+30,u.y+10);AudioSys.sfx('buff');}
        else{ // ally
          if(s.revive&&tgt.h.hp<=0){tgt.h.hp=Math.max(1,Math.round(hstat(tgt.h,'hp')*s.revive));tgt.pose='idle';}
          if(s.heal)this.setHp(tgt,this.uHp(tgt)+Math.round(this.uMaxHp(tgt)*s.heal));
          if(s.cure)for(const c of s.cure)delete tgt.h.status[c];
          this.addFloat(tgt.x+24,tgt.y,'+','#7ad08a');this.spawnParts('heal',tgt.x+30,tgt.y+16);AudioSys.sfx('heal');
        }
        u.pose='idle';yield .5;yield* this.endTurnSeq(u);return;
      }
      // technika ofensywna
      const tgts=s.target==='enemies'?this.aliveFoes():[tgt];
      u.pose='attack';u.offTX=-30;yield .2;
      const hits=s.hits||1;
      for(let hh=0;hh<hits;hh++){
        for(const t of tgts){
          if(!this.alive(t))continue;
          this.applyHit(u,t,s.pow,s.type,{status:s.status,statusCh:s.statusCh,critUp:s.critUp,pierceDef:s.pierceDef});
        }
        if(hits>1)yield .25;
      }
      yield .3;u.pose='idle';u.offTX=0;yield .35;
      yield* this.endTurnSeq(u);return;
    }
    // zwykły atak
    this.say(HEROES[u.id].name+' atakuje.');
    u.pose='attack';u.offTX=-30;yield .2;
    this.applyHit(u,tgt,1,HEROES[u.id].dmgType,{});
    yield .3;u.pose='idle';u.offTX=0;yield .35;
    yield* this.endTurnSeq(u);
  }
  *fleeSeq(u){
    this.say('Próba ucieczki...');yield .7;
    const eSpd=this.aliveFoes().reduce((s,f)=>s+this.uStat(f,'spd'),0)/this.aliveFoes().length;
    const ch=this.opts.boss?0:clamp(.55+(this.uStat(u,'spd')-eSpd)*.04,.2,.9);
    if(rnd.chance(ch)){AudioSys.sfx('flee');this.say('Uciekliście!');yield .7;popScene();if(G.mapId)AudioSys.music(MAPS[G.mapId].music||'world');}
    else{this.say('Droga odcięta!');yield .6;yield* this.endTurnSeq(u);}
  }
  *endTurnSeq(u){
    // obrażenia od statusów
    const st=this.uStatus(u);
    const ticks=[['poison',.07,'#5a9a3a'],['bleed',.05,'#b8453a'],['burn',.06,'#e89030']];
    for(const[k,frac,col]of ticks){
      if(st[k]&&this.alive(u)){
        const v=Math.max(1,Math.round(this.uMaxHp(u)*frac));
        this.setHp(u,this.uHp(u)-v);
        const px=u.kind==='foe'?u.x+u.spr.w*u.scale/2:u.x+24;
        this.addFloat(px,u.y,v+'',col);AudioSys.sfx('poison');
        st[k]--;if(st[k]<=0)delete st[k];
        if(this.uHp(u)<=0){this.kill(u);}
        yield .35;
      }
    }
    if(st.regen&&this.alive(u)){
      const v=Math.max(1,Math.round(this.uMaxHp(u)*.08));
      this.setHp(u,this.uHp(u)+v);
      this.addFloat(u.x+24,u.y,'+'+v,'#7ad08a');
      st.regen--;if(st.regen<=0)delete st.regen;
      yield .3;
    }
    if(st.fear){st.fear--;if(st.fear<=0)delete st.fear;}
    // mnożniki wygasają
    const bb=u.kind==='hero'?u.h.buffs:u.buffs;
    for(const k in bb){bb[k].turns--;if(bb[k].turns<=0)delete bb[k];}
    yield .12;
    this.cur=null;this.nextTurn();
  }
  *winSeq(){
    yield .5;
    let xp=0,gold=0;const drops=[];
    for(const f of this.foes){
      xp+=f.d.xp;gold+=f.d.gold;
      for(const it in(f.d.drops||{}))if(rnd.chance(f.d.drops[it]))drops.push(it);
    }
    // pieśni o czynach
    unlockAchv('pierwsza_krew');
    const ids=this.foes.map(f=>f.id);
    const wolves=ids.filter(i=>i==='wilk'||i==='alfa').length;
    if(wolves&&bumpCounter('wilki',wolves)>=10)unlockAchv('postrach_wilkow');
    if(ids.includes('kiel'))unlockAchv('kiel_wybity');
    if(ids.includes('biskup'))unlockAchv('popiol_biskupa');
    if(ids.includes('rotmistrz'))unlockAchv('gawron_spadl');
    if(ids.includes('niedzwiedz'))unlockAchv('grotolaz');
    if(Object.keys(G.bestiary).length>=15)unlockAchv('kronikarz');
    if(this.opts.boss&&this.aliveHeroes().length===G.party.length)unlockAchv('bez_szwanku');
    if(G.mapId&&MAPS[G.mapId]&&MAPS[G.mapId].outdoor&&isNight()){
      G.dread=Math.max(0,G.dread-30); // nakarmione cienie odpuszczają
      if(bumpCounter('nocne')>=5)unlockAchv('nocny_marek');
    }
    this.rewards={xp,gold,drops,lvls:[]};
    giveGold(gold);
    for(const it of drops)addItem(it);
    for(const h of G.party){
      if(h.hp<=0)continue;
      h.xp+=xp;
      while(h.xp>=xpNext(h.level)){
        h.xp-=xpNext(h.level);h.level++;
        const newSk=skillsFor(h).filter(k=>SKILLS[k].lvl===h.level);
        this.rewards.lvls.push(HEROES[h.id].name+' osiąga poziom '+h.level+'!'+(newSk.length?' Nowa technika: '+SKILLS[newSk[0]].name:''));
        h.hp=Math.min(hstat(h,'hp'),h.hp+Math.round(hstat(h,'hp')*.3));
        h.sp=hstat(h,'sp');
      }
      h.status={};h.buffs={};
    }
    AudioSys.sfx('levelup');
    this.state='win';
  }
  *loseSeq(){
    yield 1.2;
    popScene();setScene(GameOverScene);
  }
  finishWin(){
    for(const h of G.party){h.buffs={};}
    popScene();
    if(G.mapId&&MAPS[G.mapId])AudioSys.music(MAPS[G.mapId].music||'world');
    if(this.opts.onWin)this.opts.onWin();
  }
  // ---- sterowanie ----
  key(a){
    if(this.state==='win'){if(a==='ok'){AudioSys.sfx('confirm');this.finishWin();}return;}
    if(this.state!=='menu')return;
    const u=this.cur;
    if(this.subMenu==='target'){
      const pool=this.targetPool;
      if(a==='left'||a==='up'){this.ti=(this.ti+pool.length-1)%pool.length;AudioSys.sfx('cursor');}
      else if(a==='right'||a==='down'){this.ti=(this.ti+1)%pool.length;AudioSys.sfx('cursor');}
      else if(a==='ok'){AudioSys.sfx('confirm');this.startCo(this.heroAttack(u,pool[this.ti],this.pendSkill,this.pendItem));}
      else if(a==='cancel'){AudioSys.sfx('cancel');this.subMenu=this.backMenu||null;}
      return;
    }
    if(this.subMenu==='skills'){
      const ls=skillsFor(u.h);
      if(a==='up'){this.si=Math.max(0,this.si-1);AudioSys.sfx('cursor');}
      else if(a==='down'){this.si=Math.min(ls.length-1,this.si+1);AudioSys.sfx('cursor');}
      else if(a==='cancel'){AudioSys.sfx('cancel');this.subMenu=null;}
      else if(a==='ok'){
        const s=SKILLS[ls[this.si]];
        if(u.h.sp<s.sp){AudioSys.sfx('cancel');this.say('Za mało wigoru!');return;}
        AudioSys.sfx('confirm');this.pendSkill=ls[this.si];this.pendItem=null;
        if(s.target==='enemy'){this.targetPool=this.aliveFoes();this.subMenu='target';this.backMenu='skills';this.ti=0;}
        else if(s.target==='ally'){this.targetPool=this.heroes.filter(x=>s.revive?x.h.hp<=0:this.alive(x));
          if(!this.targetPool.length){this.say('Nie ma celu.');return;}
          this.subMenu='target';this.backMenu='skills';this.ti=0;}
        else this.startCo(this.heroAttack(u,null,this.pendSkill,null));
      }
      return;
    }
    if(this.subMenu==='items'){
      const ls=Object.keys(G.inv).filter(k=>ITEMS[k].type==='use');
      if(a==='up'){this.si=Math.max(0,this.si-1);AudioSys.sfx('cursor');}
      else if(a==='down'){this.si=Math.min(ls.length-1,this.si+1);AudioSys.sfx('cursor');}
      else if(a==='cancel'){AudioSys.sfx('cancel');this.subMenu=null;}
      else if(a==='ok'&&ls.length){
        const id=ls[this.si],it=ITEMS[id];
        AudioSys.sfx('confirm');this.pendItem=id;this.pendSkill=null;
        if(it.dmg){this.targetPool=this.aliveFoes();this.subMenu='target';this.backMenu='items';this.ti=0;}
        else{this.targetPool=this.heroes.filter(x=>it.revive?x.h.hp<=0:this.alive(x));
          if(!this.targetPool.length){this.say('Nie ma celu.');return;}
          this.subMenu='target';this.backMenu='items';this.ti=0;}
      }
      return;
    }
    // menu główne
    const cmds=this.cmds();
    if(a==='up'){this.cmd=(this.cmd+cmds.length-1)%cmds.length;AudioSys.sfx('cursor');}
    else if(a==='down'){this.cmd=(this.cmd+1)%cmds.length;AudioSys.sfx('cursor');}
    else if(a==='ok'){
      AudioSys.sfx('confirm');
      const c=cmds[this.cmd];
      if(c==='SZAŁ'){this.startCo(this.berserkSeq(this.cur));}
      else if(c==='Atak'){this.pendSkill=null;this.pendItem=null;this.targetPool=this.aliveFoes();this.subMenu='target';this.backMenu=null;this.ti=0;}
      else if(c==='Technika'){this.subMenu='skills';this.si=0;}
      else if(c==='Przedmiot'){this.subMenu='items';this.si=0;}
      else if(c==='Obrona'){this.cur.guarding=true;this.cur.pose='guard';AudioSys.sfx('buff');this.startCo(this.endTurnSeq(this.cur));}
      else if(c==='Ucieczka')this.startCo(this.fleeSeq(this.cur));
    }
  }
  cmds(){
    const base=this.opts.boss?['Atak','Technika','Przedmiot','Obrona']:['Atak','Technika','Przedmiot','Obrona','Ucieczka'];
    // czarna furia: Brand na skraju śmierci może wpaść w szał
    if(this.cur&&this.cur.id==='brand'&&this.uHp(this.cur)<=this.uMaxHp(this.cur)*.25)return['SZAŁ'].concat(base);
    return base;
  }
  *berserkSeq(u){
    this.say('BRAND WPADA W SZAŁ!');
    flash('#8a2f26',.9);shake(8);AudioSys.sfx('dark');
    unlockAchv('szal');
    yield .5;
    u.pose='attack';u.offTX=-44;yield .25;
    for(const f of this.aliveFoes()){
      this.applyHit(u,f,2.3,'slash',{critUp:.3});
      yield .2;
    }
    const self=Math.max(1,Math.round(this.uMaxHp(u)*.08));
    this.setHp(u,this.uHp(u)-self);
    this.addFloat(u.x+24,u.y,self+'','#b8453a');
    if(this.uHp(u)<=0)this.kill(u);
    const others=this.aliveHeroes().filter(x=>x!==u);
    if(others.length&&rnd.chance(.25)){
      const t=rnd.pick(others);
      this.say('Szał nie rozróżnia swoich!');
      this.applyHit(u,t,.6,'slash',{});
      if(this.alive(t)){t.pose='hurt';t.poseT=.4;}
      yield .5;
    }
    yield .35;u.pose='idle';u.offTX=0;yield .3;
    yield* this.endTurnSeq(u);
  }
  // ---- aktualizacja ----
  update(dt){
    this.t+=dt;
    if(this.state==='intro'&&this.t>1){this.state='';this.nextTurn();}
    if(this.state==='anim'&&this.co){
      this.wait-=dt;
      while(this.wait<=0&&this.co){
        const g=this.co;
        const r=g.next();
        if(r.done){
          // nextTurn mógł już podmienić korutynę — nie kasuj nowej
          if(this.co===g)this.co=null;
          break;
        }
        this.wait+=r.value;
      }
    }
    for(const u of this.heroes.concat(this.foes)){
      u.flash=Math.max(0,u.flash-dt*4);
      u.offX+=(u.offTX-u.offX)*Math.min(1,dt*12);
      if(u.poseT>0){u.poseT-=dt;if(u.poseT<=0&&u.pose==='hurt')u.pose=this.uHp(u)<=0?'ko':'idle';}
      if(u.kind==='foe'&&u.dying>0&&u.dying<2)u.dying+=dt*2.2;
    }
    for(const p of this.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.t-=dt;}
    this.parts=this.parts.filter(p=>p.t>0);
    for(const f of this.floats){f.y+=f.vy*dt;f.vy+=20*dt;f.t-=dt;}
    this.floats=this.floats.filter(f=>f.t>0);
    if(this.msg&&(this.msg.t-=dt)<=0)this.msg=null;
  }
  // ---- rysowanie ----
  draw(){
    ctx.drawImage(IMG.bg[this.opts.bg||'field'],0,0);
    for(let y=176;y<H;y++){ctx.fillStyle='#0d0a08';ctx.fillRect(0,y,W,1);}
    // wrogowie
    const foesSorted=this.foes.slice().sort((a,b)=>a.y-b.y);
    for(const f of foesSorted){
      if(f.dying>=2)continue;
      const fr=f.spr.frames[Math.floor(gTime*2.2)%2];
      const w=f.spr.w*f.scale,h=f.spr.h*f.scale;
      const fx=Math.round(f.x+f.offX),fy=Math.round(f.y-h+34);
      ctx.save();
      if(f.dying>0)ctx.globalAlpha=Math.max(0,1-(f.dying-1)*1);
      // cień
      ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(fx+w/2,f.y+34,w*.4,5,0,0,7);ctx.fill();
      ctx.drawImage(fr,fx,fy,w,h);
      if(f.flash>0){ctx.globalAlpha=Math.min(1,f.flash);ctx.drawImage(f.spr.flash,fx,fy,w,h);ctx.globalAlpha=1;}
      ctx.restore();
      // wskaźnik celu
      if(this.subMenu==='target'&&this.targetPool[this.ti]===f){
        const bob=Math.sin(gTime*8)*2;
        txt('▼',fx+w/2,fy-14+bob,'#f0d050',10,'center');
        txt(f.d.name,fx+w/2,fy-26+bob,'#f0d9a3',8,'center',true,'#0a0705');
      }
      // pasek bossa
      if(f.d.boss&&this.alive(f)){
        bar(W/2-90,10,180,6,f.hp/f.maxHp,'#9a4438','#5e2620');
        txt(f.d.name,W/2,18,'#e8dcc0',8,'center',true,'#0a0705');
      }
    }
    // bohaterowie
    this.heroes.forEach((u,i)=>{
      const set=IMG.heroes[u.id].battle;
      let img;
      if(u.pose==='idle')img=set.idle[Math.floor(gTime*2+i)%2];
      else if(u.pose==='attack')img=set.attack[u.offX<-12?1:0];
      else img=set[u.pose]||set.idle[0];
      const fx=Math.round(u.x+u.offX),fy=Math.round(u.y);
      ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(fx+30,fy+52,20,4,0,0,7);ctx.fill();
      ctx.drawImage(img,fx,fy,60,52);
      if(u.flash>0){ctx.globalAlpha=Math.min(1,u.flash);ctx.drawImage(flashOf(img),fx,fy,60,52);ctx.globalAlpha=1;}
      if(this.cur===u&&this.state==='menu'){
        const bob=Math.sin(gTime*8)*2;
        txt('▼',fx+30,fy-10+bob,'#c9a35a',10,'center');
      }
      if(this.subMenu==='target'&&this.targetPool&&this.targetPool[this.ti]===u){
        txt('▼',fx+30,fy-10,'#7ad08a',10,'center');
      }
    });
    // cząsteczki
    for(const p of this.parts){
      ctx.save();if(p.lum)ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=clamp(p.t*2,0,1);ctx.fillStyle=p.c;
      ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2);ctx.restore();
    }
    ctx.globalAlpha=1;
    // liczby obrażeń
    for(const f of this.floats){
      ctx.globalAlpha=clamp(f.t*2,0,1);
      txt(f.txt,f.x,f.y,f.c,10,'center',true,'#0a0705');
    }
    ctx.globalAlpha=1;
    // komunikat
    if(this.msg){
      const w=txtW(this.msg.text,8)+30;
      panel(W/2-w/2,30,w,18,.85);
      txt(this.msg.text,W/2,35,'#e8dcc0',8,'center');
    }
    // panel UI
    panel(4,184,W-8,82);
    // komendy
    if(this.state==='menu'&&!this.subMenu){
      const cmds=this.cmds();
      cmds.forEach((c,i)=>{
        const y=190+i*13;
        const red=c==='SZAŁ';
        if(i===this.cmd){ctx.fillStyle=red?'rgba(184,69,58,.2)':'rgba(201,163,90,.15)';ctx.fillRect(12,y-2,86,12);txt('▸',14,y,red?'#e85a4a':'#c9a35a',8);}
        txt(c,24,y,red?(Math.floor(gTime*4)%2?'#e85a4a':'#b8453a'):(i===this.cmd?'#f0d9a3':'#b8ad98'),8);
      });
    } else if(this.subMenu==='skills'){
      const ls=skillsFor(this.cur.h);
      ls.slice(0,5).forEach((sid,i)=>{
        const s=SKILLS[sid],y=192+i*14;
        if(i===this.si){ctx.fillStyle='rgba(201,163,90,.15)';ctx.fillRect(10,y-2,120,13);}
        txt(s.name,14,y,this.cur.h.sp>=s.sp?(i===this.si?'#f0d9a3':'#b8ad98'):'#5e5648',7);
        txt(s.sp+'',124,y,'#3e8e62',7,'right');
      });
      if(ls.length>5)txt('...',14,192+5*14,'#5e5648',7);
    } else if(this.subMenu==='items'){
      const ls=Object.keys(G.inv).filter(k=>ITEMS[k].type==='use');
      if(!ls.length)txt('— pusto —',14,196,'#5e5648',8);
      ls.slice(Math.max(0,this.si-3),Math.max(0,this.si-3)+5).forEach((id,vi)=>{
        const i=vi+Math.max(0,this.si-3),y=192+vi*14;
        if(i===this.si){ctx.fillStyle='rgba(201,163,90,.15)';ctx.fillRect(10,y-2,120,13);}
        txt(ITEMS[id].name,14,y,i===this.si?'#f0d9a3':'#b8ad98',7);
        txt('×'+G.inv[id],124,y,'#8d8270',7,'right');
      });
    } else if(this.state==='intro'){
      txt('Wrogowie zachodzą drogę!',16,196,'#c75a4a',9);
    }
    // statusy drużyny
    this.heroes.forEach((u,i)=>{
      const x=150,y=192+i*24,h=u.h;
      const curMark=this.cur===u&&this.state==='menu';
      if(curMark){ctx.fillStyle='rgba(201,163,90,.1)';ctx.fillRect(x-6,y-3,200,22);}
      txt(HEROES[u.id].name,x,y,h.hp<=0?'#7a3a32':(curMark?'#f0d9a3':'#d8cdb8'),8);
      bar(x+58,y+1,70,6,h.hp/hstat(h,'hp'),'#9a4438','#5e2620');
      txt(h.hp+'',x+132,y,'#b8ad98',7);
      bar(x+58,y+9,70,4,h.sp/hstat(h,'sp'),'#3e6e52','#24402f');
      txt(h.sp+'',x+132,y+8,'#8d8270',7);
      let sx=x+158;
      for(const st in h.status){if(IMG.icons[STATUS_ICO[st]]){ctx.drawImage(IMG.icons[STATUS_ICO[st]],sx,y);sx+=13;}}
      if(u.guarding){ctx.drawImage(IMG.icons.st_shield,sx,y);}
    });
    // opis spotkania
    const foesLeft=this.aliveFoes();
    let foesTxt=foesLeft.map(f=>f.d.name).filter((v,i,a)=>a.indexOf(v)===i).join(', ');
    if(foesTxt.length>30)foesTxt=foesTxt.slice(0,29)+'…';
    txt(foesTxt,344,192,'#8d8270',7);
    // ekran zwycięstwa
    if(this.state==='win'){
      const r=this.rewards;
      const hgt=86+r.lvls.length*12;
      panel(W/2-110,52,220,hgt);
      txt('ZWYCIĘSTWO',W/2,60,'#c9a35a',12,'center');
      ctx.fillStyle='#8a7142';ctx.fillRect(W/2-80,76,160,1);
      ctx.drawImage(IMG.icons.xp,W/2-76,82);
      txt(r.xp+' doświadczenia',W/2-60,84,'#d8cdb8',8);
      ctx.drawImage(IMG.icons.gold,W/2-76,96);
      txt(r.gold+' szt. srebra',W/2-60,98,'#d8cdb8',8);
      let yy=112;
      for(const d of r.drops){txt('Łup: '+ITEMS[d].name,W/2-60,yy,'#8ad07a',8);yy+=12;}
      for(const l of r.lvls){txt(l,W/2,yy,'#f0d050',8,'center');yy+=12;}
      txt('Z — dalej',W/2,52+hgt-14,'#5e5648',7,'center');
    }
    drawToasts();
    // przejście-przesłona
    if(this.state==='intro'){
      const pr=this.t/1;
      ctx.fillStyle='#000';
      const rr=Math.max(0,1-pr)*320;
      ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(W/2,H/2-40,Math.max(0.01,320-rr),0,7,true);
      ctx.fill('evenodd');
    }
  }
}

      {run:()=>unlockAchv('pasterz')},
    ];
    if(G.quests.dzwon===0)return[{say:['kaplan','Dzwonek pewnie leży gdzieś przy wschodniej ścieżce, tam gdzie pasałem owce. Zanim las je zjadł.']}];
    return[{say:['kaplan','Wioska śpi spokojniej, synu. Choć ty pewnie nie. Módl się... do czegokolwiek, co jeszcze słucha.']}];
  },
  ranny:()=>{
    if(!G.flags.twierdza_boss)return[
      {say:['ranny','Byłem w Rocie Żelaznych Ostów. Wpadliśmy nocą na coś na trakcie... Nie patrz tak. Wiem, że masz znak. ONO też wie. Nocą zawsze wie.']},
      {say:['ranny','Posłuchaj rady umierającego: nie śpij w polu. Nigdy. Mury, ogień, święcona blacha — tylko to je spowalnia.']},
    ];
    return[{say:['ranny','Jeszcze dycham, najemniku. Jak skończysz, co zacząłeś... opowiedz mi. Chcę umrzeć, wiedząc, że któryś z nas wygrał.']}];
  },
  mira_join:()=>[
    {say:['mira','...Brand. Żyjesz. Z całej kompanii myślałam, że tylko ja się wygrzebałam spod tych ciał.']},
    {say:['brand','Mira. Dowódczyni chorągwi. Widziałaś, co to było?']},
    {say:['mira','Widziałam dość, żeby wiedzieć, że to nie była robota ludzi. Ale wynajęli nas ludzie i wydali nas ludzie. Bandyci w lesie mają od tamtej nocy pełne kieszenie — od kogoś dostali list. Z pieczęcią.']},
    {say:['mira','Idę po ten list. Ze mną czy beze mnie — ale we dwoje mamy więcej szans, Brand.']},
    {join:'mira'},
    {flag:'mira_joined'},
    {quest:'glowny',stage:1},
  ],
  kiel_talk:()=>[{say:['kiel','Czego się gapisz? Wiesz, czyja to twierdza. Wyłaź, póki masz nogi.']}],
  wit_cell:()=>{
    if(!G.flags.twierdza_boss)return[
      {say:['wit','Hej! Hej, ty! Nie jesteś z nimi — wyciągnij mnie stąd! Klucz ma ich herszt, ten z toporem. Kieł.']},
      {say:['wit','Jestem Wit. Zwiadowca. Śledziłem ludzi hrabiego aż tutaj... długa historia. Wypuść mnie, a opowiem ci całą.']},
    ];
    return[
      {say:['wit','No, nareszcie. Wit, zwiadowca, do usług. Śledziłem ludzi hrabiego Vorleca — to oni woziły tu srebro dla bandytów.']},
      {say:['wit','Słyszałem przez kraty, czego szukacie. Znam bagna, znam trakty i umiem szyć rany. Bierzcie mnie ze sobą — mam z hrabią własny rachunek. Spalili mi wioskę pod "kwarantannę".']},
      {join:'wit'},
      {flag:'wit_joined'},
    ];
  },
  biskup_talk:()=>[{say:['biskup','Klęknij albo wyjdź. Innych dróg w domu popiołu nie ma.']}],
  markietan:()=>[
    {say:['kupiec','Markietan, do usług. Idę za wojskiem, a tu... no, wojska brak, ale klienci z bagien wychodzą wciąż. Tacy jak ty.']},
    {choice:[
      {t:'Handel',do:[{shop:'katedra_kram'}]},
      {t:'Co tu robisz?',do:[{say:['kupiec','Fanatycy mnie nie ruszają — raz w miesiącu kupują ode mnie sól i świece. Dużo świec. Nie pytam na co. Od pytań tu się umiera.']}]},
      {t:'Wyjdź',do:[]},
    ]},
  ],
  livia:()=>[
    {say:['dama','Nie podchodź z mieczem, najemniku. Jestem Livia. Byłam damą dworu na zamku Vorlec — uciekłam, kiedy zaczęło się... karmienie.']},
    {say:['dama','Hrabia nocami schodzi do krypty. Wnosi tam kołyskę. A z krypty czasem wychodzi coś, co nosi jego płaszcz, ale ma za dużo łokci. Gwardia udaje, że nie widzi. Idziecie tam? To nie odwaga. To pogrzeb.']},
    {say:['dama','Weźcie chociaż to. Znalazłam przy zwłokach kuriera.']},
    {give:'sole'},
  ],
  rotmistrz_talk:()=>[{say:['rotmistrz','Zawróćcie. To jedyna łaska, jaką mam dziś w ofercie.']}],
  hrabia_talk:()=>[{say:['hrabia','Goście. Jak miło. Podejdźcie — kołyska właśnie zasnęła.']}],
};

function newGame(){
  G.party=[mkHero('brand',1)];
  const b=G.party[0];
  b.equip.weapon='dwur_rdza';b.equip.armor='przeszywanica';
  b.hp=hstat(b,'hp');b.sp=hstat(b,'sp');
  G.inv={bandaz:3,gulasz:1,ziola:1};G.gold=60;
  G.flags={};G.bestiary={};G.quests={};G.counters={};G.dread=0;
  G.dayT=0.22;G.playtime=0;G.chapter='Pieśń I';
  setScene(Field);loadMap('wioska',12,12,'down');
  runScript(SCRIPTS.prolog());
}
function makeEnemies(){for(const id in ENEMIES)IMG.enemies[id]=enemySprite(ENEMIES[id].spr);}
function init(){
  AudioSys.defTracks();
  makeTiles();makeProps();makeIcons();
  makeHeroes();makeNpcs();makeEnemies();makeBgs();
  setScene(TitleScene);
  requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop);});
}
init();
