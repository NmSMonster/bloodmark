body{display:flex;align-items:center;justify-content:center;flex-direction:column}
#wrap{position:relative;line-height:0;box-shadow:0 0 60px rgba(0,0,0,.9)}
#game{image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;left:0;top:0;pointer-events:none}

<canvas id="game" width="480" height="270"></canvas>
<canvas id="ui"></canvas>

<script>
"use strict";
window.onerror=(m,s,l,c)=>{document.getElementById('err').textContent+=m+' @'+l+':'+c+'\n';};

/* ============================================================
   BLOODMARK — Pieśń Czarnego Najemnika
   Turowy RPG w klimacie mrocznego, realistycznego średniowiecza
   (inspiracja: Berserk). Bez magii — stal, krew i wigor.
   Cała grafika (spritesheety, tilesety, portrety, tła) oraz
   muzyka generowane proceduralnie w kodzie.
   ============================================================ */

//================ RDZEŃ ================
const W=480,H=270,TILE=16;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const uiCv=document.getElementById('ui'),octx=uiCv.getContext('2d');
ctx.imageSmoothingEnabled=false;
let SCALE=1;
function fit(){
  SCALE=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));
  cv.style.width=W*SCALE+'px';cv.style.height=H*SCALE+'px';
  uiCv.width=W*SCALE;uiCv.height=H*SCALE;
  uiCv.style.width=W*SCALE+'px';uiCv.style.height=H*SCALE+'px';
}
addEventListener('resize',fit);fit();

function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function RNG(seed){const f=mulberry32(seed);return{f,i:(a,b)=>a+Math.floor(f()*(b-a+1)),pick:arr=>arr[Math.floor(f()*arr.length)],chance:p=>f()<p,range:(a,b)=>a+f()*(b-a)};}
const rnd=RNG((Date.now()&0xffffff)^0x5eed); // losowość rozgrywki
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

// ---- kolory: inty 0xRRGGBB, cieniowanie z przesunięciem barwy ----
function lerpC(a,b,t){
  const ar=a>>16&255,ag=a>>8&255,ab=a&255,br=b>>16&255,bg=b>>8&255,bb=b&255;
  return (Math.round(ar+(br-ar)*t)<<16)|(Math.round(ag+(bg-ag)*t)<<8)|Math.round(ab+(bb-ab)*t);
}
const LIGHTC=0xfff0c8,DARKC=0x0a0814;
const lit=(c,t)=>lerpC(c,LIGHTC,t),dim=(c,t)=>lerpC(c,DARKC,t);
const hex=c=>'#'+(c|0x1000000).toString(16).slice(1);
const ramp=b=>[dim(b,.55),dim(b,.3),b,lit(b,.28),lit(b,.55)];

//================ WEJŚCIE ================
const held=new Set();
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Enter:'ok',KeyZ:'ok',Space:'ok',Escape:'cancel',KeyX:'cancel',KeyM:'cancel',Tab:'cancel'};
addEventListener('keydown',e=>{const a=KEYMAP[e.code];if(!a)return;e.preventDefault();AudioSys.unlock();if(!e.repeat){held.add(a);const s=topScene();if(s&&s.key)s.key(a);}});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a)held.delete(a);});
addEventListener('pointerdown',()=>AudioSys.unlock());

//================ SCENY ================
const sceneStack=[];
const topScene=()=>sceneStack[sceneStack.length-1];
function pushScene(s){sceneStack.push(s);if(s.enter)s.enter();}
function popScene(){const s=sceneStack.pop();if(s&&s.exit)s.exit();}
function setScene(s){while(sceneStack.length)popScene();pushScene(s);}

//================ EFEKTY GLOBALNE ================
const FX={shake:0,shakeP:0,flash:0,flashC:'#fff',fadeA:1,fadeDir:0,fadeCb:null,fadeSpd:2.5};
function shake(p){if(G.opts.shake)FX.shake=Math.max(FX.shake,p);}
function flash(c,p){FX.flash=p;FX.flashC=c;}
function fadeTo(cb,spd){FX.fadeDir=1;FX.fadeCb=cb;FX.fadeSpd=spd||2.5;}
function updateFX(dt){
  FX.shake=Math.max(0,FX.shake-dt*22);
  FX.flash=Math.max(0,FX.flash-dt*3.2);
  if(FX.fadeDir===1){FX.fadeA=Math.min(1,FX.fadeA+dt*FX.fadeSpd);if(FX.fadeA>=1){FX.fadeDir=-1;if(FX.fadeCb){const cb=FX.fadeCb;FX.fadeCb=null;cb();}}}
  else if(FX.fadeDir===-1){FX.fadeA=Math.max(0,FX.fadeA-dt*FX.fadeSpd);if(FX.fadeA<=0)FX.fadeDir=0;}
}

//================ AUDIO (proceduralny chiptune) ================
const AudioSys=(()=>{
  let ac=null,mGain=null,sGain=null,pending=null;
  const Music={cur:null,step:0,nextT:0,tracks:{}};
  function unlock(){
    if(ac){if(ac.state==='suspended')ac.resume();return;}
    try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    mGain=ac.createGain();mGain.gain.value=G.opts.music*0.5;mGain.connect(ac.destination);
    sGain=ac.createGain();sGain.gain.value=G.opts.sfx*0.6;sGain.connect(ac.destination);
    setInterval(tick,30);
    if(pending){play(pending);pending=null;}
  }
  function setVol(){if(ac){mGain.gain.value=G.opts.music*0.5;sGain.gain.value=G.opts.sfx*0.6;}}
  const NOTE=(semi,oct=0)=>220*Math.pow(2,(semi+oct*12)/12);
  function tone(t,freq,dur,type,vol,dest,slide=0){
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.02);
  }
  function noise(t,dur,vol,dest,hp=800){
    const n=ac.createBufferSource(),buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    n.buffer=buf;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
    const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    n.connect(f);f.connect(g);g.connect(dest);n.start(t);
  }
  // --- kompozytor: generuje patterny z seedu + progresji ---
  const MINOR=[0,2,3,5,7,8,10];
  function compose(seed,prog,bpm,opts={}){
    const r=RNG(seed),len=prog.length*16,bass=[],lead=[],drum=[];
    for(let i=0;i<len;i++){
      const root=prog[(i/16)|0];
      // bas: root na mocnych, kwinta/oktawa wypełnia
      if(i%4===0)bass.push(root);
      else if(i%8===6&&r.chance(.6))bass.push(root+(r.chance(.5)?7:12));
      else bass.push(null);
      // melodia
      if(opts.sparse?(i%8===0||(i%8===4&&r.chance(.4))):(i%2===0&&r.chance(.62))){
        const deg=r.pick([0,0,2,2,4,4,5,3,6]);
        lead.push(root+MINOR[deg%7]+(deg>=7?12:0)+(r.chance(.18)?12:0));
      } else lead.push(null);
      // perkusja
      let dr=null;
      if(!opts.noDrums){
        if(i%8===0)dr='k';else if(i%8===4)dr='s';
        else if(i%2===0&&r.chance(opts.busy?.5:.25))dr='h';
      }
      drum.push(dr);
    }
    return{bpm,len,bass,lead,drum,leadType:opts.leadType||'square',leadVol:opts.leadVol??.16,bassVol:opts.bassVol??.22,drone:opts.drone};
  }
  function defTracks(){
    Music.tracks={
      title:   compose(101,[0,-4,3,-2],62,{sparse:true,noDrums:true,leadType:'triangle',leadVol:.2,drone:0}),
      world:   compose(202,[0,8,3,10],92,{leadVol:.14}),
      village: compose(33,[0,5,8,7],76,{sparse:true,leadType:'triangle',leadVol:.17,noDrums:true}),
      forest:  compose(57,[0,-2,5,3],84,{sparse:true,leadVol:.12,drone:0}),
      dungeon: compose(404,[0,1,0,-2],66,{sparse:true,leadType:'sine',leadVol:.2,noDrums:true,drone:0}),
      swamp:   compose(550,[0,6,5,1],72,{sparse:true,leadType:'sine',leadVol:.16,noDrums:true,drone:0}),
      battle:  compose(909,[0,10,8,7],140,{busy:true,leadVol:.15}),
      boss:    compose(666,[0,1,6,7],152,{busy:true,leadVol:.16}),
      castle:  compose(777,[0,8,1,7],96,{leadVol:.13}),
    };
  }
  function play(name){
    if(!ac){pending=name;return;}
    if(Music.cur===name)return;
    Music.cur=name;Music.step=0;Music.nextT=ac.currentTime+0.06;
  }
  function stop(){Music.cur=null;pending=null;}
  function tick(){
    if(!Music.cur||!ac)return;
    const tr=Music.tracks[Music.cur];if(!tr)return;
    const spb=60/tr.bpm/4;
    while(Music.nextT<ac.currentTime+0.15){
      const s=Music.step,t=Music.nextT;
      const b=tr.bass[s];if(b!==null&&b!==undefined)tone(t,NOTE(b,-2),spb*2.1,'triangle',tr.bassVol,mGain);
      const l=tr.lead[s];if(l!==null&&l!==undefined)tone(t,NOTE(l,0),spb*1.7,tr.leadType,tr.leadVol,mGain);
      if(tr.drone!==undefined&&s%16===0)tone(t,NOTE(tr.drone,-3),spb*16,'sawtooth',.05,mGain);
      const d=tr.drum[s];
      if(d==='k')tone(t,120,0.09,'sine',.5,mGain,0.3);
      else if(d==='s')noise(t,0.08,.18,mGain,1400);
      else if(d==='h')noise(t,0.03,.1,mGain,5000);
      Music.step=(Music.step+1)%tr.len;Music.nextT+=spb;
    }
  }
  // --- SFX ---
  const SFXDEF={
    cursor:t=>tone(t,520,.05,'square',.12,sGain),
    confirm:t=>{tone(t,440,.06,'square',.14,sGain);tone(t+.06,660,.09,'square',.14,sGain);},
    cancel:t=>tone(t,330,.09,'square',.12,sGain,0.6),
    hit:t=>{noise(t,.12,.3,sGain,900);tone(t,180,.1,'square',.2,sGain,0.4);},
    crit:t=>{noise(t,.16,.4,sGain,700);tone(t,320,.14,'sawtooth',.25,sGain,0.25);},
    fire:t=>{noise(t,.3,.3,sGain,400);tone(t,90,.25,'sawtooth',.2,sGain,0.5);},
    ice:t=>{tone(t,1240,.18,'sine',.2,sGain,1.6);tone(t+.05,1860,.15,'sine',.13,sGain,1.4);},
    dark:t=>{tone(t,140,.4,'sawtooth',.2,sGain,0.4);noise(t,.3,.12,sGain,300);},
    holy:t=>{[660,830,990].forEach((f,i)=>tone(t+i*.05,f,.22,'sine',.13,sGain));},
    heal:t=>{[440,550,660,880].forEach((f,i)=>tone(t+i*.06,f,.16,'triangle',.13,sGain));},
    coin:t=>{tone(t,990,.05,'square',.12,sGain);tone(t+.05,1320,.12,'square',.12,sGain);},
    levelup:t=>{[440,554,659,880,1108].forEach((f,i)=>tone(t+i*.07,f,.2,'square',.13,sGain));},
    chest:t=>{tone(t,330,.08,'square',.14,sGain);tone(t+.09,440,.08,'square',.14,sGain);tone(t+.18,660,.18,'square',.16,sGain);},
    door:t=>{noise(t,.15,.15,sGain,250);tone(t,80,.15,'sine',.25,sGain,0.7);},
    encounter:t=>{tone(t,800,.35,'sawtooth',.18,sGain,0.18);noise(t,.25,.12,sGain,600);},
    death:t=>{tone(t,160,.7,'sawtooth',.25,sGain,0.15);noise(t,.5,.18,sGain,200);},
    flee:t=>{tone(t,500,.3,'square',.13,sGain,2.2);},
    poison:t=>{tone(t,300,.25,'sine',.16,sGain,0.5);},
    buff:t=>{tone(t,330,.12,'triangle',.15,sGain,1.5);tone(t+.1,500,.15,'triangle',.15,sGain,1.3);},
    step:t=>noise(t,.04,.05,sGain,2000),
  };
  function sfx(name){if(!ac)return;const f=SFXDEF[name];if(f)f(ac.currentTime+0.01);}
  return{unlock,sfx,music:play,stopMusic:stop,setVol,defTracks};
})();

//================ STAN GRY ================
const SAVE_KEY='bloodmark_save_',OPTS_KEY='bloodmark_opts',ACHV_KEY='bloodmark_achv';
const G={
  party:[],inv:{},gold:0,flags:{},bestiary:{},achv:{},counters:{},
  mapId:null,px:5,py:5,dir:'down',steps:0,dread:0,
  playtime:0,dayT:0.3,chapter:'Prolog',
  opts:{music:.7,sfx:.8,textSpeed:1,shake:true},
};
try{const a=localStorage.getItem('bloodmark_achv');if(a)G.achv=JSON.parse(a);}catch(e){}
try{const o=localStorage.getItem(OPTS_KEY);if(o)Object.assign(G.opts,JSON.parse(o));}catch(e){}
function saveOpts(){try{localStorage.setItem(OPTS_KEY,JSON.stringify(G.opts));}catch(e){}}

//================ RYSOWANIE UI ================
// Tekst trafia na osobny canvas w natywnej rozdzielczości — zawsze ostry.
const UIFONT="px 'Lucida Console','Courier New',monospace";
function txt(s,x,y,c='#d8cdb8',size=8,align='left',bold=true,outline=null){
  octx.font=(bold?'bold ':'')+Math.round(size*SCALE)+UIFONT;
  octx.textAlign=align;octx.textBaseline='top';
  if(outline){octx.fillStyle=outline;octx.fillText(s,x*SCALE+Math.max(1,SCALE-1),y*SCALE+Math.max(1,SCALE-1));}
  octx.fillStyle=c;octx.fillText(s,x*SCALE,y*SCALE);
}
function txtW(s,size=8,bold=true){
  octx.font=(bold?'bold ':'')+Math.round(size*SCALE)+UIFONT;
  return octx.measureText(s).width/SCALE;
}
function panel(x,y,w,h,a=0.92){
  ctx.fillStyle='rgba(13,10,8,'+a+')';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#0a0705';ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h);
  ctx.fillStyle='#8a7142';
  ctx.fillRect(x+1,y+1,w-2,1);ctx.fillRect(x+1,y+h-2,w-2,1);ctx.fillRect(x+1,y+1,1,h-2);ctx.fillRect(x+w-2,y+1,1,h-2);
  ctx.fillStyle='#c9a35a';
  ctx.fillRect(x,y,3,1);ctx.fillRect(x,y,1,3);ctx.fillRect(x+w-3,y,3,1);ctx.fillRect(x+w-1,y,1,3);
  ctx.fillRect(x,y+h-1,3,1);ctx.fillRect(x,y+h-3,1,3);ctx.fillRect(x+w-3,y+h-1,3,1);ctx.fillRect(x+w-1,y+h-3,1,3);
}
function bar(x,y,w,h,frac,c1,c2){
  frac=clamp(frac,0,1);
  ctx.fillStyle='#1a140e';ctx.fillRect(x,y,w,h);
  if(frac>0){const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);
    ctx.fillStyle=g;ctx.fillRect(x+1,y+1,Math.max(1,Math.round((w-2)*frac)),h-2);}
  ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeRect(x+.5,y+.5,w-1,h-1);
}

//================ GŁÓWNA PĘTLA ================
let lastT=0,acc=0;const STEP=1/60;let gTime=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,(t-lastT)/1000);lastT=t;acc+=dt;
  while(acc>=STEP){gTime+=STEP;updateFX(STEP);const s=topScene();if(s&&s.update)s.update(STEP);acc-=STEP;}
  render();
}
function render(){
  octx.clearRect(0,0,uiCv.width,uiCv.height);
  ctx.save();octx.save();
  if(FX.shake>0){
    const sx=Math.round((Math.random()*2-1)*FX.shake),sy=Math.round((Math.random()*2-1)*FX.shake);
    ctx.translate(sx,sy);octx.translate(sx*SCALE,sy*SCALE);
  }
  ctx.fillStyle='#060504';ctx.fillRect(-8,-8,W+16,H+16);
  let i=sceneStack.length-1;while(i>0&&sceneStack[i].overlay)i--;
  for(;i<sceneStack.length;i++)if(sceneStack[i].draw)sceneStack[i].draw();
  ctx.restore();octx.restore();
  if(FX.flash>0){ctx.globalAlpha=Math.min(1,FX.flash);ctx.fillStyle=FX.flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  // winieta + ziarno
  vignette();
  if(FX.fadeA>0){
    ctx.globalAlpha=FX.fadeA;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    octx.globalAlpha=FX.fadeA;octx.fillStyle='#000';octx.fillRect(0,0,uiCv.width,uiCv.height);octx.globalAlpha=1;
  }
}
let vigCv=null,grainCv=null,grainT=0;
function vignette(){
  if(!vigCv){
    vigCv=document.createElement('canvas');vigCv.width=W;vigCv.height=H;
    const c=vigCv.getContext('2d');
    const g=c.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*0.95);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.45)');
    c.fillStyle=g;c.fillRect(0,0,W,H);
    grainCv=document.createElement('canvas');grainCv.width=W;grainCv.height=H;
    const gc=grainCv.getContext('2d'),id=gc.createImageData(W,H);
    for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=14;}
    gc.putImageData(id,0,0);
  }
  ctx.drawImage(vigCv,0,0);
  grainT+=1;
  ctx.save();ctx.globalAlpha=.5;
  ctx.drawImage(grainCv,(grainT*7)%32-32,(grainT*13)%32-32);
  ctx.restore();
}

//================ BUFOR PIKSELI ================
class Pix{
  constructor(w,h){this.w=w;this.h=h;this.d=new Int32Array(w*h).fill(-1);}
  set(x,y,c){x|=0;y|=0;if(x<0||y<0||x>=this.w||y>=this.h)return;this.d[y*this.w+x]=c;}
  get(x,y){x|=0;y|=0;if(x<0||y<0||x>=this.w||y>=this.h)return -1;return this.d[y*this.w+x];}
  frect(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,c);}
  ellipse(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,c);}}
  line(x0,y0,x1,y1,c){x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;for(;;){this.set(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx;}if(e2<dx){e+=dx;y0+=sy;}}}
  paste(o,ox,oy){for(let y=0;y<o.h;y++)for(let x=0;x<o.w;x++){const c=o.get(x,y);if(c>=0)this.set(ox+x,oy+y,c);}}
  mirrored(){const m=new Pix(this.w,this.h);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)m.d[y*this.w+x]=this.d[y*this.w+(this.w-1-x)];return m;}
  mirrorLR(){const half=Math.floor(this.w/2);for(let y=0;y<this.h;y++)for(let x=0;x<half;x++)this.d[y*this.w+(this.w-1-x)]=this.d[y*this.w+x];}
  copy(){const m=new Pix(this.w,this.h);m.d.set(this.d);return m;}
  noise(r,amt,p=.3){for(let i=0;i<this.d.length;i++){if(this.d[i]>=0&&r.chance(p)){this.d[i]=r.chance(.5)?dim(this.d[i],amt):lit(this.d[i],amt*.8);}}}
  shade(s=1){
    const old=this.d.slice();
    for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){
      const c=old[y*this.w+x];if(c<0)continue;
      const up=y===0?-1:old[(y-1)*this.w+x],dn=y===this.h-1?-1:old[(y+1)*this.w+x];
      const lf=x===0?-1:old[y*this.w+x-1];
      let t=0;if(up<0)t+=.3;if(lf<0)t+=.1;
      let d=0;if(dn<0)d+=.28;
      if(t>0)this.d[y*this.w+x]=lit(c,t*s);
      else if(d>0)this.d[y*this.w+x]=dim(c,d*s);
    }
  }
  outline(oc=0x0b0810){
    const old=this.d.slice();
    for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){
      if(old[y*this.w+x]>=0)continue;
      const n=(x>0&&old[y*this.w+x-1]>=0)||(x<this.w-1&&old[y*this.w+x+1]>=0)||(y>0&&old[(y-1)*this.w+x]>=0)||(y<this.h-1&&old[(y+1)*this.w+x]>=0);
      if(n)this.d[y*this.w+x]=oc;
    }
  }
  recolor(map){ // map: {odKoloru: doKoloru} — palette swap dla wariantów
    for(let i=0;i<this.d.length;i++){const c=this.d[i];if(c>=0&&map[c]!==undefined)this.d[i]=map[c];}
  }
  hueShift(target,t){for(let i=0;i<this.d.length;i++){if(this.d[i]>=0)this.d[i]=lerpC(this.d[i],target,t);}}
  toCanvas(scale=1){
    const c=document.createElement('canvas');c.width=this.w*scale;c.height=this.h*scale;
    const g=c.getContext('2d');
    for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){
      const v=this.d[y*this.w+x];if(v<0)continue;
      g.fillStyle=hex(v);g.fillRect(x*scale,y*scale,scale,scale);
    }
    return c;
  }
}

    for(let j=0;j<10;j++){const ins=Math.floor((9-j)*0.8);p.frect(ins,j+2,20-ins*2,1,j%2?cl:lit(cl,.1));}
    p.frect(2,12,2,5,0x4a3823);p.frect(16,12,2,5,0x4a3823);
    p.frect(3,12,14,3,lit(0x4a3823,.15));
    p.noise(r,.08,.2);p.shade();p.outline();P.stall=propFromPix(p);}
}

//================ POSTACIE (generator humanoidów) ================
Pix.prototype.rot90=function(){const m=new Pix(this.h,this.w);for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)m.d[x*m.w+(m.w-1-y)]=this.d[y*this.w+x];return m;};

function blade(p,x0,y0,x1,y1,wdt,steel=0x98a2ac){
  const dx=x1-x0,dy=y1-y0,len=Math.max(1,Math.max(Math.abs(dx),Math.abs(dy)));
  const nx=-dy/len,ny=dx/len;
  for(let t=0;t<=len;t++){
    const fx=x0+dx*t/len,fy=y0+dy*t/len;
    const taper=(t>len-3&&wdt>0)?wdt-1:wdt; // zwężenie czubka
    for(let w=-taper;w<=taper;w++){
      const c=w===0?lit(steel,.28):(Math.abs(w)===wdt?dim(steel,.32):steel);
      p.set(Math.round(fx+nx*w),Math.round(fy+ny*w),c);
    }
  }
}
function hilt(p,x,y,horiz,gold=0x6b5436){ // jelec + rękojeść
  if(horiz){p.frect(x,y-2,1,5,gold);p.frect(x+1,y,3,1,0x3a2c1c);}
  else{p.frect(x-2,y,5,1,gold);p.frect(x,y+1,1,3,0x3a2c1c);}
}

function hairFront(p,o){
  const h=o.hair,st=o.hairStyle;
  if(st===2){ // kaptur
    p.frect(4,1,8,3,o.top2);p.frect(4,4,1,5,o.top2);p.frect(11,4,1,5,o.top2);
    p.frect(5,2,6,2,dim(o.top2,.18));p.frect(5,3,6,1,0x0e0b08);return;
  }
  p.frect(5,1,6,2,h);p.set(4,2,h);p.set(11,2,h);p.frect(5,3,6,1,h);
  if(st===0){p.set(4,3,h);p.set(11,3,h);p.set(4,4,h);p.set(11,4,h);}
  if(st===1){p.frect(4,3,1,5,h);p.frect(11,3,1,5,h);p.set(3,5,h);p.set(12,5,h);}
  if(st===3){p.set(4,3,h);p.set(11,3,h);p.frect(4,4,1,2,h);p.frect(11,4,1,2,h);}
  if(st===4){p.frect(5,1,6,1,dim(h,.1));}
  if(st===5){p.set(4,1,h);p.set(11,1,h);p.set(5,0,h);p.set(8,0,h);p.set(10,0,h);p.set(4,3,h);p.set(11,3,h);p.set(4,4,h);p.set(11,4,h);}
}
function hairBack(p,o){
  const h=o.hair,st=o.hairStyle;
  if(st===2){p.frect(4,1,8,8,o.top2);p.frect(5,2,6,2,dim(o.top2,.15));return;}
  p.frect(5,1,6,7,h);p.frect(4,2,1,5,h);p.frect(11,2,1,5,h);
  if(st===1){p.frect(4,7,8,2,h);}
  if(st===3){p.frect(7,8,2,4,h);p.set(7,12,dim(h,.1));}
  if(st===4){p.frect(5,1,6,7,o.skin);p.frect(5,1,6,2,dim(h,.1));}
  if(st===5){p.set(5,0,h);p.set(8,0,h);p.set(10,0,h);}
}

function charPix(o,view,frame){
  const p=new Pix(16,20);
  const sk=o.skin,tp=o.top,pn=o.pants,bt=o.boots;
  const la=frame===1?1:(frame===2?-1:0); // faza kroku
  if(view==='down'||view==='up'){
    // miecz dwuręczny na plecach — widoczny zza sylwetki w widoku frontowym
    if(o.weapon==='greatsword'&&view==='down'){blade(p,12,1,14,5,1);p.set(13,0,0x3a2c1c);}
    // nogi (faza kroku unosi jedną nogę)
    const lLift=la>0?1:0,rLift=la<0?1:0;
    p.frect(5,14,3,4-lLift,pn);p.frect(8,14,3,4-rLift,pn);
    p.frect(5,18-lLift,3,2,bt);p.frect(8,18-rLift,3,2,bt);
    // tors
    p.frect(4,9,8,5,tp);p.frect(4,9,8,1,lit(tp,.12));
    p.frect(5,10,2,3,o.top2||dim(tp,.2)); // kamizela/pas skórzany
    p.frect(4,13,8,1,dim(tp,.4)); // pas
    p.set(7,13,0x8a7142); // klamra
    // ramiona
    const sw=la;
    p.frect(3,9+(sw>0?1:0),1,4,tp);p.frect(12,9+(sw<0?1:0),1,4,tp);
    p.set(3,13+(sw>0?1:0),sk);p.set(12,13+(sw<0?1:0),sk);
    // głowa
    p.frect(5,2,6,6,sk);p.set(4,4,sk);p.set(11,4,sk);
    if(view==='down'){
      hairFront(p,o);
      p.set(6,5,0x14100a);p.set(9,5,0x14100a); // oczy
      if(o.scar)p.set(9,4,dim(sk,.3)); // blizna
      p.set(7,7,dim(sk,.25));p.set(8,7,dim(sk,.25)); // usta/cień
    } else {
      hairBack(p,o);
      if(o.weapon==='greatsword'){blade(p,4,15,12,2,1);hilt(p,12,2,false);}
      if(o.weapon==='sword'){blade(p,11,9,13,15,0);p.set(11,8,0x6b5436);}
    }
  } else { // bok, w lewo
    const fx=6+(la>0?-1:0),bx2=9+(la<0?1:0);
    // tylna noga + but
    p.frect(bx2,14,2,4,dim(pn,.15));p.frect(bx2,18,2,2,dim(bt,.1));
    if(o.weapon==='greatsword'){blade(p,11,16,12,2,1);hilt(p,12,2,false);} // miecz na plecach
    // przednia noga + but
    p.frect(fx,14,2,4,pn);p.frect(fx,18,2,2,bt);
    // tors
    p.frect(6,9,5,5,tp);p.frect(6,9,5,1,lit(tp,.12));p.frect(6,13,5,1,dim(tp,.4));
    // ramię przednie
    p.frect(6,10,2,3,dim(tp,.08));p.set(6,13,sk);
    // głowa (profil)
    p.frect(5,2,6,6,sk);p.set(4,5,sk);p.set(4,6,sk); // nos
    const h=o.hair;
    if(o.helm){const st=0x6e7682;p.frect(5,1,7,4,st);p.frect(5,2,7,1,lit(st,.22));p.frect(9,5,3,3,dim(st,.12));p.set(5,5,dim(st,.05));if(o.plume){p.set(7,0,0x8a2f26);p.set(8,0,0x8a2f26);p.set(9,1,0x6e2018);}}
    else if(o.hairStyle===2){p.frect(5,1,7,4,o.top2);p.frect(9,5,3,4,o.top2);p.set(11,8,o.top2);}
    else{
      p.frect(5,1,7,2,h);p.frect(9,3,3,3,h);p.frect(10,6,2,2,h);
      if(o.hairStyle===1){p.frect(10,8,2,3,h);}
      if(o.hairStyle===3){p.frect(11,7,1,4,h);}
      if(o.hairStyle===5){p.set(5,0,h);p.set(8,0,h);p.set(11,2,h);}
    }
    p.set(6,5,0x14100a); // oko
    if(o.scar)p.set(6,4,dim(sk,.3));
    if(o.weapon==='sword'){blade(p,8,16,12,17,0);p.set(7,16,0x6b5436);} // pochwa przy biodrze
  }
  p.shade(.7);p.outline();
  return p;
}

// ---- pozy bitewne (30×26, zwrócone w lewo) ----
function battlePix(o,pose,frame){
  const p=new Pix(30,26);
  const body=charPix(o,'side',pose==='attack'&&frame===1?1:0);
  const sk=o.skin;
  if(pose==='ko'){
    const lying=body.rot90();
    p.paste(lying,4,8);
    // przyciemnienie
    for(let i=0;i<p.d.length;i++)if(p.d[i]>=0)p.d[i]=dim(p.d[i],.18);
    return p;
  }
  let bx=8,by=5;
  if(pose==='idle'&&frame===1)by=6;
  if(pose==='hurt'){bx=11;}
  if(pose==='attack'&&frame===0){bx=11;}
  if(pose==='attack'&&frame===1){bx=5;}
  p.paste(body,bx,by);
  // bronie — rysowane na wierzchu
  const wpn=o.weapon,gs=wpn==='greatsword',sw=wpn==='sword',kn=wpn==='knife',
    ax=wpn==='axe',mc=wpn==='mace',sp=wpn==='spear',bw=wpn==='bow',cb=wpn==='crossbow',wh=wpn==='whip';
  const wood=0x4a3823,steel=0x98a2ac;
  if(pose==='idle'||pose==='use'){
    if(gs){blade(p,bx+2,by+9,bx+16,by-4,1);hilt(p,bx+3,by+10,false);}
    if(sw){blade(p,bx-1,by+4,bx+5,by+11,0);hilt(p,bx+5,by+11,false);}
    if(kn){blade(p,bx-1,by+9,bx+2,by+11,0);}
    if(ax){p.line(bx+1,by+13,bx+5,by+3,wood);p.frect(bx+2,by+1,4,4,steel);p.frect(bx+2,by+1,1,4,lit(steel,.2));}
    if(mc){p.line(bx+1,by+12,bx+3,by+6,wood);p.ellipse(bx+3,by+4,2,2,dim(steel,.15));p.set(bx+1,by+2,steel);p.set(bx+5,by+2,steel);p.set(bx+3,by+1,steel);}
    if(sp){p.line(bx-2,by+15,bx+5,by-4,wood);blade(p,bx+5,by-4,bx+7,by-7,0);}
    if(bw){p.line(bx-3,by+3,bx-1,by+9,wood);p.line(bx-1,by+9,bx-2,by+14,wood);p.line(bx-3,by+3,bx-2,by+14,0xb0a890);}
    if(cb){p.frect(bx-5,by+9,7,1,wood);p.frect(bx-4,by+7,1,5,steel);blade(p,bx-5,by+9,bx-3,by+9,0);}
    if(wh){p.line(bx-1,by+10,bx-3,by+14,0x3a2c1c);p.line(bx-3,by+14,bx-6,by+12,0x3a2c1c);}
    if(o.shield){p.ellipse(bx-2,by+9,2.6,3.4,0x5a4630);p.ellipse(bx-2,by+9,1.2,1.6,steel);p.set(bx-2,by+9,lit(steel,.2));}
    if(pose==='use'){p.frect(bx-3,by+8,3,1,sk);p.set(bx-4,by+7,0xb8453a);} // wyciągnięta ręka z przedmiotem
  }
  if(pose==='attack'){
    if(frame===0){ // zamach
      if(gs){blade(p,bx+4,by+8,bx+10,by-7,1);hilt(p,bx+4,by+7,false);}
      if(sw){blade(p,bx+2,by+6,bx+8,by-3,0);hilt(p,bx+3,by+6,false);}
      if(kn){blade(p,bx+4,by+4,bx+7,by+1,0);}
      if(ax){p.line(bx+2,by+9,bx+7,by-2,wood);p.frect(bx+6,by-5,4,4,steel);}
      if(mc){p.line(bx+2,by+9,bx+6,by-1,wood);p.ellipse(bx+7,by-3,2,2,dim(steel,.15));}
      if(sp){p.line(bx+6,by+11,bx-1,by+6,wood);blade(p,bx-1,by+6,bx-4,by+4,0);}
      if(bw){p.line(bx-4,by+2,bx-2,by+8,wood);p.line(bx-2,by+8,bx-3,by+13,wood);p.line(bx-4,by+2,bx-1,by+8,0xb0a890);p.line(bx-1,by+8,bx-3,by+13,0xb0a890);blade(p,bx-3,by+8,bx+2,by+8,0);}
      if(cb){p.frect(bx-6,by+8,8,1,wood);p.frect(bx-5,by+6,1,5,steel);}
      if(wh){p.line(bx+1,by+8,bx+5,by-2,0x3a2c1c);}
    } else { // cięcie / strzał
      if(gs){blade(p,bx+4,by+10,bx-13,by+8,1);hilt(p,bx+3,by+10,true);
        p.set(bx-10,by+3,0xcfd6dc);p.set(bx-13,by+5,0x98a2ac);p.set(bx-7,by+1,0xcfd6dc);} // smugi
      if(sw){blade(p,bx+2,by+9,bx-9,by+7,0);hilt(p,bx+2,by+9,true);p.set(bx-7,by+3,0xcfd6dc);}
      if(kn){blade(p,bx-2,by+9,bx-6,by+8,0);p.set(bx-9,by+8,0xcfd6dc);} // rzut
      if(ax){p.line(bx+3,by+9,bx-5,by+8,wood);p.frect(bx-9,by+6,4,4,steel);p.set(bx-11,by+5,0xcfd6dc);}
      if(mc){p.line(bx+3,by+9,bx-4,by+8,wood);p.ellipse(bx-6,by+8,2,2,dim(steel,.15));p.set(bx-9,by+6,0xcfd6dc);}
      if(sp){p.line(bx+5,by+10,bx-10,by+9,wood);blade(p,bx-10,by+9,bx-13,by+9,0);p.set(bx-14,by+8,0xcfd6dc);}
      if(bw){p.line(bx-4,by+2,bx-2,by+8,wood);p.line(bx-2,by+8,bx-3,by+13,wood);p.line(bx-4,by+2,bx-3,by+13,0xb0a890);blade(p,bx-8,by+8,bx-13,by+8,0);}
      if(cb){p.frect(bx-6,by+8,8,1,wood);p.frect(bx-5,by+6,1,5,steel);blade(p,bx-10,by+8,bx-14,by+8,0);}
      if(wh){p.line(bx+1,by+9,bx-5,by+7,0x3a2c1c);p.line(bx-5,by+7,bx-11,by+10,0x3a2c1c);p.set(bx-12,by+10,0x6b5436);}
    }
  }
  if(pose==='guard'){
    if(o.shield){p.ellipse(bx-3,by+8,3,4.4,0x5a4630);p.ellipse(bx-3,by+8,1.4,2,steel);}
    else if(gs){blade(p,bx-2,by+16,bx-1,by-3,1);hilt(p,bx-1,by+13,true);}
    else{blade(p,bx-2,by+14,bx-1,by+1,0);hilt(p,bx-2,by+12,true);}
  }
  if(pose==='hurt'){
    p.set(bx-2,by+6,0xb8453a);p.set(bx-4,by+9,0xb8453a);p.set(bx-1,by+3,0x8a2f26); // krew
    if(gs)blade(p,bx+3,by+12,bx+10,by+16,1);
  }
  return p;
}

// ---- portrety 28×28 ----
function portraitPix(o){
  const p=new Pix(28,28),sk=o.skin,h=o.hair;
  // ramiona
  p.frect(3,23,22,5,o.top);p.frect(3,23,22,1,lit(o.top,.15));
  p.frect(11,21,6,3,sk); // szyja
  // głowa
  p.frect(7,4,14,16,sk);p.frect(8,3,12,1,sk);p.frect(8,20,12,2,sk);p.frect(9,22,10,1,dim(sk,.1));
  // włosy
  if(o.hairStyle===2){
    p.frect(5,1,18,6,o.top2);p.frect(5,7,2,12,o.top2);p.frect(21,7,2,12,o.top2);
    p.frect(7,2,14,2,dim(o.top2,.2));
  } else {
    p.frect(6,1,16,4,h);p.frect(6,5,2,4,h);p.frect(20,5,2,4,h);
    if(o.hairStyle===0){p.frect(6,5,2,3,h);p.frect(20,5,2,3,h);}
    if(o.hairStyle===1||o.hairStyle===3){p.frect(5,4,2,14,h);p.frect(21,4,2,14,h);p.frect(6,1,16,5,h);}
    if(o.hairStyle===4){p.frect(6,1,16,4,sk);p.frect(6,1,16,2,dim(h,.05));}
    if(o.hairStyle===5){p.set(6,0,h);p.set(10,0,h);p.set(14,0,h);p.set(18,0,h);p.set(21,1,h);p.frect(6,1,16,5,h);p.set(5,3,h);p.set(22,3,h);}
  }
  // brwi i oczy
  p.frect(9,10,4,1,dim(h,.1));p.frect(15,10,4,1,dim(h,.1));
  p.frect(9,12,3,2,0xe8e0d0);p.frect(15,12,3,2,0xe8e0d0);
  p.set(10,12,0x14100a);p.set(16,12,0x14100a);p.set(10,13,0x2a2118);p.set(16,13,0x2a2118);
  // nos, usta
  p.set(13,15,dim(sk,.2));p.set(14,16,dim(sk,.25));
  p.frect(12,18,5,1,dim(sk,.3));
  // cienie policzków
  p.frect(7,16,1,4,dim(sk,.12));p.frect(20,16,1,4,dim(sk,.12));
  if(o.scar){p.line(16,8,19,14,dim(sk,.35));p.set(17,10,0x8a4a3a);}
  if(o.grim){p.frect(12,18,5,1,dim(sk,.45));p.frect(9,11,4,1,dim(h,.05));p.frect(15,11,4,1,dim(h,.05));}
  p.shade(.5);p.outline();
  return p;
}

//================ POTWORY (archetypy, zwrócone w prawo) ================
function whiteMask(cnv){
  const c=document.createElement('canvas');c.width=cnv.width;c.height=cnv.height;
  const g=c.getContext('2d');g.drawImage(cnv,0,0);
  g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  return c;
}

// bestia czworonożna: wilk / ogar / dzik / niedźwiedź
function beastPix(o,f){
  const w=o.big?34:28,h=o.big?24:20,p=new Pix(w,h),r=RNG(o.seed+f);
  const c=o.col,legH=o.big?6:5,by=h-2-legH; // by = spód tułowia
  const len=o.big?22:16,cx=w/2-1;
  // ogon
  if(o.tail!=='none')p.line(cx-len/2-1,by-4,cx-len/2-4,by-7+(f===1?2:0),dim(c,.1));
  // nogi (4)
  const lo=f===1?1:0;
  [[cx-len/2+2,lo],[cx-len/2+5,-0],[cx+len/2-6,0],[cx+len/2-3,lo]].forEach(([lx,off],i)=>{
    p.frect(lx,by,2,legH-(i%2===lo?1:0),dim(c,i<2?.18:.05));
  });
  // tułów
  p.ellipse(cx,by-4,len/2,o.big?5.5:4,c);
  if(o.mane)p.frect(cx-len/2+2,by-9+(o.big?0:1),len-6,3,dim(c,.22)); // grzywa/garb
  // łeb (z prawej)
  const hx=cx+len/2+1,hy=by-7+(f===1?1:0);
  p.ellipse(hx,hy,o.big?4:3.4,o.big?3.6:3,c);
  p.frect(hx+2,hy,o.snout||3,2,dim(c,.08)); // pysk
  p.set(hx+(o.snout||3)+1,hy+1,0x14100a); // nozdrza
  if(o.ears){p.set(hx-1,hy-4,c);p.set(hx-2,hy-3,c);p.set(hx+1,hy-4,c);}
  p.set(hx+1,hy-1,o.eye||0xc23a2a); // ślepie
  // kły / szczęka
  p.frect(hx+1,hy+2,3,1,dim(c,.3));
  if(o.tusks){p.set(hx+3,hy+3,0xe8e0d0);p.set(hx+5,hy+2,0xe8e0d0);}
  if(o.fangs&&f===1){p.set(hx+2,hy+3,0xe8e0d0);}
  p.noise(r,.14,.3);p.shade(.8);p.outline();
  return p;
}
// szkielet poległego żołnierza
function skeletonPix(o,f){
  const p=new Pix(24,26),r=RNG(o.seed+f),bn=o.col||0xa89f88;
  const tilt=f===1?1:0;
  // nogi
  p.line(10,17,9,24,bn);p.line(13,17,14,24,bn);p.frect(8,24,3,1,dim(bn,.1));p.frect(13,24,3,1,dim(bn,.1));
  p.set(10,20,dim(bn,.25));p.set(13,20,dim(bn,.25)); // kolana
  // miednica i kręgosłup
  p.frect(9,15,6,2,bn);p.line(11,8,11+tilt,15,bn);
  // żebra
  for(let i=0;i<3;i++){p.frect(8+tilt,9+i*2,8,1,bn);p.set(8+tilt,10+i*2,dim(bn,.3));}
  // ramiona — jedno z zardzewiałym orężem
  p.line(8+tilt,9,5,14,bn);p.line(15+tilt,9,18,13,bn);
  blade(p,18,13,22,5,0,0x7a6a52); // zardzewiały tasak
  // czaszka
  p.ellipse(11+tilt,5,3.4,3.2,bn);p.frect(9+tilt,7,5,2,bn);
  p.set(10+tilt,5,0x14100a);p.set(13+tilt,5,0x14100a);p.frect(10+tilt,8,4,1,dim(bn,.35));
  if(o.helm){p.frect(8+tilt,1,7,3,0x565e6a);p.frect(8+tilt,2,7,1,lit(0x565e6a,.15));}
  p.noise(r,.1,.25);p.shade(.7);p.outline();
  return p;
}
// upiór nocy (dithering = widmowość)
function ghostPix(o,f){
  const p=new Pix(24,26),r=RNG(o.seed),c=o.col||0x7a8294;
  for(let y=2;y<24;y++){
    const ph=Math.sin((y+f*2)*0.7+o.seed)*2;
    const wHere=y<8?(4+y):(11-Math.max(0,(y-16))*0.8);
    for(let x=0;x<24;x++){
      const dx=x-11-(y>14?ph:0);
      if(Math.abs(dx)<wHere*0.9){
        if(y>15&&(x+y+f)%2===0)continue; // rozpływające się dithery
        if(y>20&&(x+y)%3!==0)continue;
        p.set(x,y,Math.abs(dx)>wHere*0.6?dim(c,.25):c);
      }
    }
  }
  // oczodoły i rozdarta paszcza
  p.frect(8,8,2,3,0x0c0a10);p.frect(14,8,2,3,0x0c0a10);
  p.set(8,8,0x4a90b8);p.set(14,8,0x4a90b8);
  p.frect(10,13,4,1+f,0x0c0a10);
  p.noise(r,.12,.2);p.outline(0x14182a);
  return p;
}
// topielec / opętany trup
function drownedPix(o,f){

  p.set(6,18,dim(c,.05));p.set(18,18,dim(c,.05)); // dłonie
  p.ellipse(12+tilt,5,3.4,3.2,c); // przekrzywiony łeb
  p.set(11+tilt,4,0xd8e0c0);p.set(14+tilt,5,0x14100a); // wybałuszone oko + oczodół
  p.frect(11+tilt,7,3,1,0x14100a); // obwisła szczęka

// opętany (wykrzywiony fanatyk)
function possessedPix(o,f){

// stado kruków
function swarmPix(o,f){
  const p=new Pix(30,24),r=RNG(o.seed),c=o.col||0x1c1a20;
  for(let i=0;i<8;i++){
    const x=r.i(3,26),y=r.i(2,20),fl=(i+f)%2;
    p.set(x,y,c);p.set(x+1,y,c);
    p.set(x-1,y-fl,c);p.set(x+2,y-fl,c);
    p.set(x-2,y-fl*2+1,dim(c,.1));p.set(x+3,y-fl*2+1,dim(c,.1));
    if(i<3)p.set(x+2,y,0xc23a2a); // ślepia
  }
  p.outline(0x0c0a10);
  return p;
}
// żmija / wąż bagienny
function snakePix(o,f){
  const p=new Pix(28,20),r=RNG(o.seed),c=o.col||0x4a5a32;
  for(let x=2;x<20;x++){
    const y=14+Math.round(Math.sin((x+f*2)*0.55)*2.2);
    p.frect(x,y,1,3,x%4<2?c:dim(c,.18));
  }
  p.line(20,14,23,8,c);p.frect(21,5,4,4,c); // wzniesiony łeb
  p.set(24,6,0xe8d050);p.set(25,8,0x14100a);
  if(f===1){p.set(26,7,0xc23a2a);p.set(27,7,0xc23a2a);} // jęzor
  p.noise(r,.14,.3);p.shade(.7);p.outline();
  return p;
}
// APOSTOŁ — przemieniony hrabia (wielka bestia z paszczą w cielsku)
function apostlePix(o,f){
  const p=new Pix(56,46),r=RNG(o.seed+f),fl=o.col||0x6a4640;
  // cielsko — warstwy fałd
  p.ellipse(28,30,22,13,fl);
  p.ellipse(28,22,18,9,lit(fl,.06));

  for(let i=0;i<7;i++){const x=r.i(10,46),y=r.i(18,40);p.ellipse(x,y,r.i(2,4),r.i(1,3),r.chance(.5)?dim(fl,.12):lit(fl,.08));} // fałdy
  // wielka paszcza w poprzek cielska
  p.ellipse(28,30,15,5.5,0x230d10);
  for(let i=0;i<8;i++){const tx=15+i*3.6;p.set(tx,26+(i%2),0xe8e0d0);p.set(tx,27+(i%2),0xd8d0c0);p.set(tx+1,33-(i%2),0xe8e0d0);} // zębiska
  if(f===1)p.ellipse(28,30,9,2,0x3a1216); // przełyk pulsuje
  // małe oczy rozsiane
  [[14,16],[40,14],[22,12],[34,11],[10,24],[46,22]].forEach(([x,y],i)=>{p.set(x,y,0xe8d050);p.set(x+1,y,0x14100a);});
  // głowa-człowiek na czubku (resztka hrabiego)
  p.ellipse(28,7,4,4.4,0xb98c60);p.set(26,6,0x14100a);p.set(30,6,0x14100a);p.frect(27,9,3,1,0x14100a);
  p.frect(24,3,9,2,dim(0xb98c60,.3)); // resztki korony/włosów
  // macki
  p.line(6,28,1,18+(f===1?3:0),dim(fl,.1));p.line(50,28,55,17+(f===1?2:0),dim(fl,.1));
  p.line(8,36,2,40,dim(fl,.18));p.line(48,36,54,41,dim(fl,.18));
  p.noise(r,.12,.3);p.shade(.8);p.outline();
  return p;
}

// fabryka sprite'ów wroga
function enemySprite(d){
  const gens={beast:beastPix,skeleton:skeletonPix,ghost:ghostPix,drowned:drownedPix,
    possessed:possessedPix,swarm:swarmPix,snake:snakePix,apostle:apostlePix};
  let frames;
  if(d.gen==='human'){
    const bs=[battlePix(d.look,'idle',0).mirrored(),battlePix(d.look,'idle',1).mirrored()];
    frames=bs.map(q=>q.toCanvas());
    const atk=[battlePix(d.look,'attack',0).mirrored().toCanvas(),battlePix(d.look,'attack',1).mirrored().toCanvas()];
    return{frames,attack:atk,flash:whiteMask(frames[0]),w:frames[0].width,h:frames[0].height,scale:d.scale||2};
  }
  const fn=gens[d.gen];
  frames=[fn(d,0).toCanvas(),fn(d,1).toCanvas()];
  return{frames,flash:whiteMask(frames[0]),w:frames[0].width,h:frames[0].height,scale:d.scale||2};
}

//================ TŁA BITEWNE ================
function makeBgs(){
  const BGH=176;
  const mk=(name,fn)=>{const c=document.createElement('canvas');c.width=W;c.height=BGH;fn(c.getContext('2d'),RNG(name.length*977+13));IMG.bg[name]=c;};
  const skyGrad=(g,top,bot,hor)=>{for(let y=0;y<hor;y++){g.fillStyle=hex(lerpC(top,bot,y/hor));g.fillRect(0,y,W,1);}};
  const silhouette=(g,r,col,baseY,amp,step,trees)=>{
    let y=baseY+r.i(-amp,amp);
    for(let x=0;x<W;x+=step){
      const ny=clamp(baseY+r.i(-amp,amp),20,BGH);
      g.fillStyle=hex(col);
      for(let i=0;i<step&&x+i<W;i++){const yy=Math.round(lerp(y,ny,i/step));g.fillRect(x+i,yy,1,BGH-yy);}
      y=ny;
      if(trees&&r.chance(.5)){const tx=x+r.i(0,step),th=r.i(8,22);
        g.fillRect(tx,y-th,2,th);
        for(let b=0;b<3;b++)g.fillRect(tx-r.i(1,4),y-th+3+b*4,r.i(4,9),1);}
    }
  };
  const ground=(g,r,col,from)=>{

const xpNext=lv=>Math.floor(24*Math.pow(lv,1.75));
function mkHero(id,level=1){
  const h={id,level,xp:0,equip:{weapon:null,armor:null,acc:null},status:{},buffs:{}};
  h.hp=hstat(h,'hp');h.sp=hstat(h,'sp');
  return h;
}
function hstat(h,k){
  const d=HEROES[h.id];
  let v=d.base[k]+d.grow[k]*(h.level-1);
  for(const slot of['weapon','armor','acc']){
    const it=h.equip[slot]&&ITEMS[h.equip[slot]];
    if(it&&it.stats&&it.stats[k])v+=it.stats[k];
  }
  return Math.max(1,Math.round(v));
}
const heroAlive=h=>h.hp>0;
const partyAlive=()=>G.party.filter(heroAlive);

//================ ŚWIAT: ŁADOWANIE MAP ================
const SOLIDCH=new Set(['~','s','M','l','_','#','T','t','P','R','G','F']);
const WALKF=new Set(['.',',',';','=',':','S','a','f','b','w','c','d']);
let MC=null; // cache bieżącej mapy

function buildMap(m){
  const mw=Math.max(...m.grid.map(r=>r.length));
  const grid=m.grid.map(r=>r.padEnd(mw,m.pad||'T'));
  const mh=grid.length;
  const solid=new Uint8Array(mw*mh);
  for(let y=0;y<mh;y++)for(let x=0;x<mw;x++)if(SOLIDCH.has(grid[y][x]))solid[y*mw+x]=1;
  const T=IMG.tiles;
  const frames=[0,1,2].map(f=>{
    const c=document.createElement('canvas');c.width=mw*16;c.height=mh*16;
    const g=c.getContext('2d');g.imageSmoothingEnabled=false;
    for(let y=0;y<mh;y++)for(let x=0;x<mw;x++){
      const ch=grid[y][x];let t=null;
      const gv=T.grass[(x*7+y*13)%3];
      switch(ch){
        case'.':t=gv;break;case',':t=T.grass[(x*5+y*3+1)%3];break;
        case';':t=T.tall;break;case'=':t=T.path;break;case':':t=T.dirt;break;
        case'~':t=T.water[f];break;case'S':case's':t=T.swamp[f];break;
        case'M':t=T.mtn;break;case'a':t=T.ash;break;case'l':t=T.lava[f];break;
        case'b':t=T.bridge;break;case'w':t=T.floor_wood;break;case'c':t=T.carpet;break;
        case'd':t=T.stairs;break;case'_':t=T.void;break;
        case'f':t=T[m.floor||'floor_crypt'][(x+y)%2];break;
        case'#':{const below=y+1<mh?grid[y+1][x]:'#';const ws=T[m.wall||'wall_crypt'];
          t=WALKF.has(below)?ws.front:ws.top;break;}
        default:t=gv;
      }
      g.drawImage(t,x*16,y*16);
      // brzegi wody/bagna — jaśniejsza linia przy lądzie
      if(ch==='~'||ch==='s'){
        const lc=ch==='~'?'rgba(90,120,140,.5)':'rgba(90,110,70,.45)';g.fillStyle=lc;
        if(y>0&&WALKF.has(grid[y-1][x]))g.fillRect(x*16,y*16,16,1);
        if(y<mh-1&&WALKF.has(grid[y+1][x]))g.fillRect(x*16,y*16+15,16,1);
        if(x>0&&WALKF.has(grid[y][x-1]))g.fillRect(x*16,y*16,1,16);
        if(x<mw-1&&WALKF.has(grid[y][x+1]))g.fillRect(x*16,y*16,1,16);
      }
    }
    return c;
  });
  // obiekty
  const objs=[];
  for(const od of(m.objects||[])){
    const o=Object.assign({},od);
    if(o.type==='house'){
      o.art=IMG.props.house(o.seed||1,o.tw,o.roof||0x5e3a2e);
      for(let i=0;i<o.tw;i++){solid[(o.y)*mw+o.x+i]=1;solid[(o.y-1)*mw+o.x+i]=1;}
      o.doorX=o.x+(o.tw>>1);
    }
    if(o.type==='prop'){const pr=IMG.props[o.p];if(pr.solid!==false&&!o.nosolid)solid[o.y*mw+o.x]=1;}
    if(o.type==='npc'){o.fx=o.x;o.fy=o.y;o.dir=o.dir||'down';o.wt=rnd.range(1,3);o.step=0;o.home={x:o.x,y:o.y};}
    if(o.type==='chest'){if(!o.nosolid)solid[o.y*mw+o.x]=1;}
    objs.push(o);
  }
  return{m,mw,mh,grid,solid,frames,objs};
}
function objVisible(o){
  if(o.ifFlag&&!G.flags[o.ifFlag])return false;
  if(o.notFlag&&G.flags[o.notFlag])return false;
  if(o.type==='chest'&&G.flags['chest_'+o.id]===undefined){}
  return true;
}
function isSolid(x,y){
  if(x<0||y<0||x>=MC.mw||y>=MC.mh)return true;
  if(MC.solid[y*MC.mw+x])return true;
  for(const o of MC.objs){
    if(!objVisible(o))continue;
    if(o.type==='npc'&&Math.round(o.fx)===x&&Math.round(o.fy)===y)return true;
  }
  return false;
}
function loadMap(id,tx,ty,dir){
  const m=MAPS[id];G.mapId=id;G.px=tx;G.py=ty;if(dir)G.dir=dir;
  MC=buildMap(m);
  Field.pl={fx:tx,fy:ty,moving:false,mt:0,step:0,sinceEnc:0};
  Field.banner={t:3,text:m.name};
  Field.ash=[];
  AudioSys.music(m.music||'world');
}

//================ ŚWIAT: SCENA ================
const isNight=()=>G.dayT>0.55&&G.dayT<0.95;
function nightAmount(){
  const t=G.dayT;
  if(t<0.45)return 0;if(t<0.55)return (t-0.45)/0.1;
  if(t<0.92)return 1;if(t<1)return 1-(t-0.92)/0.08;return 0;
}
const toasts=[];
function pushToast(text,icon){toasts.push({text,icon,t:3});}

const Field={
  pl:null,banner:null,ash:[],
  enter(){},
  update(dt){
    const m=MC.m,p=this.pl;
    G.playtime+=dt;
    if(m.outdoor)G.dayT=(G.dayT+dt/300)%1;
    // ruch gracza
    if(p.moving){
      p.mt+=dt*6.5;
      if(p.mt>=1){p.mt=0;p.moving=false;p.fx=G.px;p.fy=G.py;this.afterStep();}
      else{p.fx=lerp(p.ox,G.px,p.mt);p.fy=lerp(p.oy,G.py,p.mt);}
    }
    if(!p.moving){
      let dx=0,dy=0;
      if(held.has('up')){dy=-1;G.dir='up';}else if(held.has('down')){dy=1;G.dir='down';}
      else if(held.has('left')){dx=-1;G.dir='left';}else if(held.has('right')){dx=1;G.dir='right';}
      if(dx||dy){
        const nx=G.px+dx,ny=G.py+dy;
        if(!isSolid(nx,ny)){p.ox=G.px;p.oy=G.py;G.px=nx;G.py=ny;p.moving=true;p.mt=0;p.step=(p.step+1)%4;}
      } else p.step=0;
    }
    // NPC błądzą
    for(const o of MC.objs){
      if(o.type!=='npc'||!objVisible(o)||o.static)continue;
      if(o.moving){
        o.mt+=dt*3;
        if(o.mt>=1){o.moving=false;o.fx=o.tx;o.fy=o.ty;o.x=o.tx;o.y=o.ty;}
        else{o.fx=lerp(o.x,o.tx,o.mt);o.fy=lerp(o.y,o.ty,o.mt);}
      } else {
        o.wt-=dt;
        if(o.wt<=0){
          o.wt=rnd.range(1.6,4);
          const d=rnd.pick([[0,1,'down'],[0,-1,'up'],[1,0,'right'],[-1,0,'left'],[0,0,o.dir]]);
          o.dir=d[2];
          const tx=o.x+d[0],ty=o.y+d[1];
          if((d[0]||d[1])&&Math.abs(tx-o.home.x)<=2&&Math.abs(ty-o.home.y)<=2
            &&!isSolid(tx,ty)&&!(tx===G.px&&ty===G.py)&&!SOLIDCH.has(MC.grid[ty][tx])&&MC.grid[ty][tx]!==';'){
            o.tx=tx;o.ty=ty;o.moving=true;o.mt=0;
          }
        }
      }
    }
    // popiół z nieba
    if(m.outdoor){
      if(this.ash.length<46)this.ash.push({x:Math.random()*W,y:-4,vx:-4-Math.random()*8,vy:9+Math.random()*14,a:.2+Math.random()*.4});
      for(const f of this.ash){f.x+=f.vx*dt;f.y+=f.vy*dt;}
      this.ash=this.ash.filter(f=>f.y<H+6&&f.x>-6);
    }
    for(const t of toasts)t.t-=dt;
    while(toasts.length&&toasts[0].t<=0)toasts.shift();
    if(this.banner)this.banner.t-=dt;
  },
  afterStep(){
    const m=MC.m;
    // Uwaga Zasłony — nocą w polu piętno przyciąga upiory; ogień je odgania
    if(m.outdoor&&isNight()){
      let nearFire=false;
      for(let dy=-3;dy<=3&&!nearFire;dy++)for(let dx=-3;dx<=3;dx++){
        const yy=G.py+dy,xx=G.px+dx;
        if(yy>=0&&yy<MC.mh&&xx>=0&&xx<MC.mw&&MC.grid[yy][xx]==='F'){nearFire=true;break;}
      }
      G.dread=clamp(G.dread+(nearFire?-9:2.2),0,100);
    } else G.dread=Math.max(0,G.dread-1.5);
    // wyjścia
    for(const o of MC.objs){
      if(!objVisible(o))continue;
      if(o.type==='exit'&&o.x===G.px&&o.y===G.py){
        AudioSys.sfx('step');
        fadeTo(()=>loadMap(o.to,o.tx,o.ty,o.dir));return;
      }
      if(o.type==='trig'&&o.x===G.px&&o.y===G.py){
        if(o.once&&G.flags['trig_'+o.id])continue;
        if(o.unless&&G.flags[o.unless])continue; // warunek minął → przejście wolne
        const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[G.dir];
        if(o.bounce){G.px-=d[0];G.py-=d[1];this.pl.fx=G.px;this.pl.fy=G.py;}
        if(o.once)G.flags['trig_'+o.id]=true;
        runScript(SCRIPTS[o.script]());return;
      }
    }
    // spotkania losowe
    const ch=MC.grid[G.py][G.px];
    const enc=m.enc&&ENC[m.enc];
    if(enc&&(m.encTiles||[';']).includes(ch)){
      this.pl.sinceEnc++;
      const night=m.outdoor&&isNight();
      const pool=night?(enc.night||enc.day):enc.day;
      const rate=enc.rate*(night?(1.4+G.dread/45):1);
      if(this.pl.sinceEnc>3&&rnd.chance(rate)){
        this.pl.sinceEnc=0;
        AudioSys.sfx('encounter');flash('#1a1018',1.2);shake(4);
        let group=rnd.pick(pool);
        if(night&&G.dread>=70&&group.length<4)group=group.concat([rnd.pick(['upior','cien'])]); // Zasłona patrzy zbyt długo
        startBattle(group,{bg:night?'night':enc.bg,music:'battle'});
      }
    }
  },
  facingTile(){
    const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[G.dir];
    return[G.px+d[0],G.py+d[1]];
  },
  key(a){
    if(this.pl.moving)return;
    if(a==='cancel'){AudioSys.sfx('confirm');pushScene(new MenuScene());return;}
    if(a!=='ok')return;
    const[fx,fy]=this.facingTile();
    for(const o of MC.objs){
      if(!objVisible(o))continue;
      const ox=o.type==='npc'?Math.round(o.fx):o.x,oy=o.type==='npc'?Math.round(o.fy):o.y;
      if(o.type==='npc'&&ox===fx&&oy===fy){
        o.dir={up:'down',down:'up',left:'right',right:'left'}[G.dir];
        runScript(NPC_DLG[o.dlg]());return;
      }
      if(o.type==='chest'&&o.x===fx&&o.y===fy&&!G.flags['chest_'+o.id]){
        G.flags['chest_'+o.id]=true;AudioSys.sfx('chest');
        if(o.item){addItem(o.item,o.n||1);pushToast('Znaleziono: '+ITEMS[o.item].name+(o.n>1?' ×'+o.n:''),ITEMS[o.item].icon);}
        if(o.gold){giveGold(o.gold);pushToast('Znaleziono: '+o.gold+' szt. srebra','gold');}
        return;
      }
      if(o.type==='house'&&o.doorX===fx&&o.y===fy&&o.door){
        AudioSys.sfx('door');runScript(NPC_DLG[o.door]());return;
      }
      if(o.type==='door'&&o.x===fx&&o.y===fy){AudioSys.sfx('door');runScript(NPC_DLG[o.dlg]());return;}
      if(o.type==='sign'&&o.x===fx&&o.y===fy){runScript([{say:['',o.text]}]);return;}
      if(o.type==='pickup'&&o.x===fx&&o.y===fy&&!G.flags['pick_'+o.id]){
        G.flags['pick_'+o.id]=true;AudioSys.sfx('chest');
        addItem(o.item,1);pushToast('Zerwano: '+ITEMS[o.item].name,ITEMS[o.item].icon);return;
      }
    }
  },
  camera(){
    const px=this.pl.fx*16+8,py=this.pl.fy*16+10;
    return[clamp(Math.round(px-W/2),0,MC.mw*16-W),clamp(Math.round(py-H/2),0,MC.mh*16-H)];
  },
  draw(){
    const m=MC.m,[cx,cy]=this.camera();
    const wf=Math.floor(gTime*2.5)%3;
    ctx.drawImage(MC.frames[wf],-cx,-cy);
    // byty sortowane po Y
    const ents=[];
    const x0=Math.floor(cx/16)-2,x1=Math.ceil((cx+W)/16)+2,y0=Math.floor(cy/16)-2,y1=Math.ceil((cy+H)/16)+3;
    for(let y=Math.max(0,y0);y<Math.min(MC.mh,y1);y++)for(let x=Math.max(0,x0);x<Math.min(MC.mw,x1);x++){
      const ch=MC.grid[y][x];let pr=null;
      if(ch==='T')pr=IMG.props['tree'+((x*7+y*5)%3)];
      else if(ch==='t')pr=IMG.props['tree'+((x*3+y)%3)];
      else if(ch==='P')pr=IMG.props['pine'+((x+y)%2)];
      else if(ch==='R')pr=IMG.props.boulder;
      else if(ch==='G')pr=IMG.props['grave'+((x*5+y*7)%2)];
      else if(ch==='F')pr=IMG.props.fire[Math.floor(gTime*7)%3];
      if(pr)ents.push({y:y*16+16,draw:()=>ctx.drawImage(pr.cv,x*16+8-(pr.w>>1)-cx,(y+1)*16-pr.h-cy)});
    }
    for(const o of MC.objs){
      if(!objVisible(o))continue;
      if(o.type==='house'){
        const a=o.art;
        ents.push({y:(o.y+1)*16,draw:()=>ctx.drawImage(a.cv,o.x*16-cx,(o.y+1)*16-a.h-cy)});
      } else if(o.type==='prop'){
        const pr=IMG.props[o.p];if(!pr)continue;
        const av=Array.isArray(pr)?pr[Math.floor(gTime*7)%3]:pr;
        ents.push({y:(o.y+1)*16,draw:()=>ctx.drawImage(av.cv,o.x*16+8-(av.w>>1)-cx,(o.y+1)*16-av.h-cy)});
      } else if(o.type==='chest'){
        const pr=G.flags['chest_'+o.id]?IMG.props.chest_open:IMG.props.chest;
        ents.push({y:(o.y+1)*16,draw:()=>ctx.drawImage(pr.cv,o.x*16+1-cx,(o.y+1)*16-pr.h-1-cy)});
      } else if(o.type==='pickup'){
        if(G.flags['pick_'+o.id])continue;
        const pr=IMG.props[o.p||'flower'];
        ents.push({y:(o.y+1)*16,draw:()=>ctx.drawImage(pr.cv,o.x*16+8-(pr.w>>1)-cx,(o.y+1)*16-pr.h-1-cy)});
      } else if(o.type==='npc'){
        const sheet=IMG.npcs[o.npc]||IMG.heroes[o.npc];
        const fr=o.moving?[0,1,0,2][Math.floor(o.mt*4)%4]:0;
        const cnv=sheet.walk[o.dir][fr];
        ents.push({y:o.fy*16+16,draw:()=>ctx.drawImage(cnv,Math.round(o.fx*16)-cx,Math.round((o.fy+1)*16)-20-cy)});
      }
    }
    // gracz
    const p=this.pl,lead=G.party[0]?G.party[0].id:'brand';
    const pfr=p.moving?[0,1,0,2][Math.floor((p.mt+p.step)*2)%4]:0;
    const pcv=IMG.heroes[lead].walk[G.dir][p.moving?[0,1,0,2][p.step]:0];
    ents.push({y:p.fy*16+16,draw:()=>ctx.drawImage(pcv,Math.round(p.fx*16)-cx,Math.round((p.fy+1)*16)-20-cy)});
    ents.sort((a,b)=>a.y-b.y);
    for(const e of ents)e.draw();
    // mrok lochu
    if(m.dark){
      ctx.save();
      ctx.fillStyle='rgba(4,3,6,.82)';
      ctx.globalCompositeOperation='source-over';
      const dk=document.createElement?null:null;
      // światło gracza + pochodnie przez 'lighter' nie zadziała na czerni — użyj gradientu odejmowanego
      const grd=ctx.createRadialGradient(p.fx*16+8-cx,p.fy*16+8-cy,18,p.fx*16+8-cx,p.fy*16+8-cy,86);
      grd.addColorStop(0,'rgba(4,3,6,0)');grd.addColorStop(1,'rgba(4,3,6,.85)');
      ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
      for(const o of MC.objs){
        if(o.type==='prop'&&(o.p==='torch'||o.p==='fire')){
          const tx=o.x*16+8-cx,ty=o.y*16+8-cy;
          if(tx<-40||tx>W+40||ty<-40||ty>H+40)continue;
          const g2=ctx.createRadialGradient(tx,ty,4,tx,ty,40);
          g2.addColorStop(0,'rgba(232,144,48,.28)');g2.addColorStop(1,'rgba(232,144,48,0)');
          ctx.globalCompositeOperation='lighter';ctx.fillStyle=g2;ctx.fillRect(tx-40,ty-40,80,80);
          ctx.globalCompositeOperation='source-over';
        }
      }
      ctx.restore();
    }
    // tonacja dnia / nocy
    if(m.outdoor){
      const nt=nightAmount();
      if(nt>0){
        ctx.save();ctx.globalCompositeOperation='multiply';
        ctx.fillStyle='rgba('+Math.round(lerp(255,68,nt))+','+Math.round(lerp(255,76,nt))+','+Math.round(lerp(255,120,nt))+',1)';
        ctx.fillRect(0,0,W,H);ctx.restore();
        // ogniska świecą nocą
        ctx.save();ctx.globalCompositeOperation='lighter';
        for(let y=Math.max(0,y0);y<Math.min(MC.mh,y1);y++)for(let x=Math.max(0,x0);x<Math.min(MC.mw,x1);x++){
          if(MC.grid[y][x]==='F'){
            const tx=x*16+8-cx,ty=y*16+8-cy;
            const g2=ctx.createRadialGradient(tx,ty,4,tx,ty,44);
            g2.addColorStop(0,'rgba(232,144,48,'+(.3*nt)+')');g2.addColorStop(1,'rgba(232,144,48,0)');
            ctx.fillStyle=g2;ctx.fillRect(tx-44,ty-44,88,88);
          }
        }
        ctx.restore();
      }
      // popiół
      ctx.fillStyle='rgba(180,175,165,.5)';
      for(const f of this.ash)ctx.fillRect(Math.round(f.x),Math.round(f.y),1,1);
    }
    // HUD
    if(this.banner&&this.banner.t>0){
      const a=Math.min(1,this.banner.t);
      ctx.globalAlpha=a;octx.globalAlpha=a;
      txt(this.banner.text,W/2,16,'#c9a35a',12,'center',true,'#0a0705');
      const tw=txtW(this.banner.text,12);
      ctx.fillStyle='#8a7142';ctx.fillRect(W/2-tw/2,30,tw,1);
      if(m.outdoor&&isNight()){txt('— noc. Piętno krwawi —',W/2,34,'#b8453a',8,'center');}
      ctx.globalAlpha=1;octx.globalAlpha=1;
    }
    // minimapa
    {
      const ms=Math.min(64/(MC.mw*16),44/(MC.mh*16));
      const mw=Math.round(MC.mw*16*ms),mh=Math.round(MC.mh*16*ms);
      panel(W-mw-12,6,mw+8,mh+8,.75);
      ctx.globalAlpha=.85;
      ctx.drawImage(MC.frames[0],W-mw-8,10,mw,mh);
      ctx.globalAlpha=1;
      for(const o of MC.objs)if(o.type==='exit'){
        ctx.fillStyle='#c9a35a';
        ctx.fillRect(W-mw-8+Math.round(o.x*16*ms)-1,10+Math.round(o.y*16*ms)-1,2,2);
      }
      const pl=this.pl;
      ctx.fillStyle=Math.floor(gTime*3)%2?'#e85a4a':'#b8453a';
      ctx.fillRect(W-mw-8+Math.round((pl.fx*16+8)*ms)-1,10+Math.round((pl.fy*16+8)*ms)-1,2,2);
      // Uwaga Zasłony (nocą w polu)
      if(m.outdoor&&nightAmount()>0.3){
        const dy=mh+20;
        const pulse=G.dread>70?(.7+Math.sin(gTime*6)*.3):1;
        panel(W-78,dy,72,17,.8);
        ctx.drawImage(IMG.icons.skull,W-75,dy+2);
        ctx.globalAlpha=pulse;
        bar(W-60,dy+4,50,7,G.dread/100,'#a83a52','#5e1a2a');
        ctx.globalAlpha=1;
        txt('Zasłona patrzy',W-74,dy+19,G.dread>70?'#e85a4a':'#8d8270',6);
      }
    }
    drawToasts();
  },
};
function drawToasts(){
  let ty=H-64;
  for(const t of toasts){
    const a=clamp(t.t,0,1);
    ctx.globalAlpha=a;octx.globalAlpha=a;
    const w=txtW(t.text,8)+34;
    panel(W-w-6,ty,w,18,.85);
    if(t.icon&&IMG.icons[t.icon])ctx.drawImage(IMG.icons[t.icon],W-w+2,ty+3);
    txt(t.text,W-w+18,ty+5,'#d8cdb8',8);
    ctx.globalAlpha=1;octx.globalAlpha=1;ty-=22;
  }
}

//================ DIALOGI ================
function runScript(script,onDone){pushScene(new DialogScene(script,onDone));}
class DialogScene{
  constructor(script,onDone){this.s=script;this.i=-1;this.overlay=true;this.shown=0;this.choice=null;this.ci=0;this.cur=null;this.onDone=onDone;}
  enter(){this.advance();}
  advance(){
    for(;;){
      this.i++;
      if(this.i>=this.s.length){popScene();if(this.onDone)this.onDone();return;}
      const st=this.s[this.i];
      if(st.say){this.cur=st;this.shown=0;this.choice=null;return;}
      if(st.choice){this.cur=null;this.choice=st.choice.filter(c=>!c.ifFlag||G.flags[c.ifFlag]);this.ci=0;return;}
      if(st.flag!==undefined)G.flags[st.flag]=st.v===undefined?true:st.v;
      if(st.give){addItem(st.give,st.n||1);AudioSys.sfx('chest');pushToast('Otrzymano: '+ITEMS[st.give].name+((st.n||1)>1?' ×'+st.n:''),ITEMS[st.give].icon);}
      if(st.take)remItem(st.take,st.n||1);
      if(st.gold){giveGold(st.gold);AudioSys.sfx('coin');pushToast((st.gold>0?'Otrzymano: ':'Zapłacono: ')+Math.abs(st.gold)+' szt. srebra','gold');}
      if(st.join){const h=mkHero(st.join,Math.max(1,(G.party[0]?G.party[0].level:1)-0));
        if(st.join==='mira'){h.equip.weapon='palasz_stary';h.equip.armor='przeszywanica';}
        if(st.join==='wit'){h.equip.weapon='noze_mysl';h.equip.armor='przeszywanica';}
        G.party.push(h);AudioSys.sfx('levelup');pushToast(HEROES[st.join].name+' dołącza do drużyny!','heart');}
      if(st.heal){for(const h of G.party){h.hp=hstat(h,'hp');h.sp=hstat(h,'sp');h.status={};}G.dread=0;}
      if(st.sfx)AudioSys.sfx(st.sfx);
      if(st.music)AudioSys.music(st.music);
      if(st.quest){G.quests[st.quest]=st.stage;pushToast('Dziennik: '+QUESTS[st.quest].name,'scroll');AudioSys.sfx('confirm');}
      if(st.shop){pushScene(new ShopScene(st.shop));return;}
      if(st.battle){
        const b=st.battle,self=this;
        startBattle(b.group,{bg:b.bg,music:b.music||'battle',boss:b.boss,canFlee:b.canFlee!==false,
          onWin:()=>{if(b.onWin)runScript(b.onWin,()=>self.advance());else self.advance();}});

function wrapTxt(s,x,y,maxW,c,size,lh){
  const words=s.split(' ');let line='',yy=y;
  for(const w of words){
    const t=line?line+' '+w:w;
    if(txtW(t,size)>maxW){txt(line,x,yy,c,size);line=w;yy+=lh;}
    else line=t;
  }
  if(line)txt(line,x,yy,c,size);
  return yy;
}

class ShopScene{

  list(){return this.mode==='kup'?this.shop.items:Object.keys(G.inv).filter(k=>ITEMS[k].type!=='key');}
  key(a){
    const ls=this.list();

    if(a==='left'||a==='right'){this.mode=this.mode==='kup'?'sprzedaj':'kup';this.i=0;AudioSys.sfx('cursor');return;}

        else AudioSys.sfx('cancel');
      } else {
        const v=Math.floor(it.price/2);
        remItem(id);giveGold(v);AudioSys.sfx('coin');pushToast('Sprzedano: '+it.name+' (+'+v+')','gold');
        if(this.i>=this.list().length)this.i=Math.max(0,this.list().length-1);
      }
    }
  }
  update(){}
  draw(){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    panel(30,18,W-60,H-36);

    txt('Srebro: '+G.gold,W-44,26,'#f0d9a3',9,'right');

    const ls=this.list();
    if(this.i<this.scroll)this.scroll=this.i;
    if(this.i>this.scroll+8)this.scroll=this.i-8;
    const x0=44,y0=56;
    if(!ls.length)txt('— pusto —',W/2,100,'#8d8270',9,'center');
    ls.slice(this.scroll,this.scroll+9).forEach((id,vi)=>{
      const i=vi+this.scroll,it=ITEMS[id],y=y0+vi*16;

      if(IMG.icons[it.icon])ctx.drawImage(IMG.icons[it.icon],x0-2,y);
      txt(it.name+(this.mode==='sprzedaj'?' ×'+G.inv[id]:''),x0+14,y+2,i===this.i?'#f0d9a3':'#d8cdb8',8);
      const pr=this.mode==='kup'?it.price:Math.floor(it.price/2);
      txt(pr+'',x0+236,y+2,this.mode==='kup'&&G.gold<pr?'#b8453a':'#c9a35a',8,'right');
    });
    // opis + porównanie
    const id=ls[this.i];
    if(id){
      const it=ITEMS[id];
      panel(40,H-66,W-80,44,.96);
      wrapTxt(it.desc,50,H-58,W-100,'#b8ad98',8,11);
      if(it.stats){
        let sx=50;
        for(const h of G.party){
          if(it.who&&it.who!==h.id)continue;
          const slot=it.type;
          const cur=h.equip[slot]?(ITEMS[h.equip[slot]].stats||{}):{};
          const keys=new Set([...Object.keys(it.stats),...Object.keys(cur)]);
          let diffs=[];
          for(const k of keys){const d=(it.stats[k]||0)-(cur[k]||0);if(d)diffs.push(k.toUpperCase()+(d>0?'+':'')+d);}
          txt(HEROES[h.id].name+': '+(diffs.length?diffs.join(' '):'='),sx,H-36,'#8ad07a',8);
          sx+=130;
        }
      }
    }
  }
}

function gridRect(g,x0,y0,x1,y1,ch){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)g[y][x]=ch;}

function genVillage(){
  const w=30,h=20,g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill('.'));
  gridRect(g,0,0,w-1,0,'T');gridRect(g,0,h-1,w-1,h-1,'T');gridRect(g,0,0,0,h-1,'T');gridRect(g,w-1,0,w-1,h-1,'T');
  gridRect(g,1,1,3,2,'~');               // staw
  gridRect(g,8,7,17,13,':');             // majdan
  gridRect(g,18,10,29,11,'=');           // trakt do bramy wschodniej
  g[16][6]='G';g[16][9]='G';g[17][7]='G';g[17][10]='G';g[15][8]='G'; // cmentarzyk
  g[11][12]='F';                         // ognisko na majdanie
  [[5,3],[24,3],[25,16],[3,12],[14,2],[8,4]].forEach(([x,y])=>{g[y][x]='T';if(x+1<w-1)g[y][x+1]='t';if(y+1<h-1)g[y+1][x]='t';});
  return g.map(r=>r.join(''));
}
function genWild(o){
  const r=RNG(o.seed),w=o.w,h=o.h;
  const g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill(o.base));
  for(let i=0;i<o.blobs;i++){ // kępy gęstwiny
    let x=r.i(2,w-3),y=r.i(2,h-3);const n=r.i(5,16),ch=r.pick(o.dense);
    for(let j=0;j<n;j++){
      if(x>0&&y>0&&x<w-1&&y<h-1)g[y][x]=ch;
      x=clamp(x+r.i(-1,1),1,w-2);y=clamp(y+r.i(-1,1),1,h-2);
    }
  }
  for(let x=0;x<w;x++){g[0][x]=o.border;g[h-1][x]=o.border;}
  for(let y=0;y<h;y++){g[y][0]=o.border;g[y][w-1]=o.border;}
  for(let i=0;i<w*h*0.05;i++){const x=r.i(1,w-2),y=r.i(1,h-2);
    if(x<3||y<3||x>w-4||y>h-4)g[y][x]=o.border;}
  const carve=(x0,y0,x1,y1)=>{
    let x=x0,y=y0;g[y][x]=o.path;let guard=0;
    while((x!==x1||y!==y1)&&guard++<900){
      const dx=Math.sign(x1-x),dy=Math.sign(y1-y);
      if(r.chance(.7)){if(dx&&(r.chance(.55)||!dy))x+=dx;else if(dy)y+=dy;else if(dx)x+=dx;}
      else{x=clamp(x+r.i(-1,1),1,w-2);y=clamp(y+r.i(-1,1),1,h-2);}
      g[y][x]=o.path;
      if(r.chance(.45)){const sx=clamp(x+r.i(-1,1),1,w-2),sy=clamp(y+r.i(-1,1),1,h-2);
        if(g[sy][sx]!==o.path)g[sy][sx]=o.clear||o.base;}
    }
  };
  for(const[a,b]of o.paths)carve(a[0],a[1],b[0],b[1]);
  for(let i=0;i<(o.encBlobs||0);i++){ // kępy spotkań
    let x=r.i(3,w-4),y=r.i(3,h-4);
    for(let j=0;j<r.i(6,16);j++){
      if(g[y][x]===o.base||g[y][x]===o.alt)g[y][x]=o.encCh;
      x=clamp(x+r.i(-1,1),1,w-2);y=clamp(y+r.i(-1,1),1,h-2);
    }
  }
  for(const[x,y,ch]of(o.force||[]))g[y][x]=ch;
  return g.map(r=>r.join(''));
}
function genFort(){
  const w=34,h=22,g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill('#'));
  gridRect(g,2,2,8,4,'f');gridRect(g,11,2,22,4,'f');gridRect(g,25,2,31,4,'f'); // skarbce i sala Kła
  gridRect(g,2,6,31,8,'f');                                                   // korytarz
  gridRect(g,2,10,8,13,'f');gridRect(g,2,15,8,19,'f');                        // cele
  gridRect(g,11,10,31,19,'f');                                                // sala główna
  g[5][5]='f';g[5][16]='f';g[5][17]='f';g[5][28]='f';
  g[9][4]='f';g[9][18]='f';g[9][19]='f';g[14][4]='f';
  gridRect(g,16,20,17,21,'f');                                                // wejście
  return g.map(r=>r.join(''));
}
function genCathedral(){
  const w=32,h=20,g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill('#'));
  gridRect(g,2,2,29,10,'f');   // nawa
  gridRect(g,2,13,29,16,'f');  // przedsionek
  g[11][15]='f';g[11][16]='f';g[12][15]='f';g[12][16]='f';
  gridRect(g,15,17,16,19,'f'); // wejście
  return g.map(r=>r.join(''));
}
function genCastle(){
  const w=36,h=24,g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill('#'));
  gridRect(g,2,2,33,11,'f');   // sala tronowa
  gridRect(g,2,14,33,21,'f');  // sala dolna
  gridRect(g,17,12,18,13,'c'); // przejście
  gridRect(g,17,4,18,21,'c');  // dywan
  gridRect(g,17,22,18,23,'c'); // wejście
  return g.map(r=>r.join(''));
}

function saveGame(slot){
  const d={v:1,party:G.party.map(h=>({id:h.id,level:h.level,xp:h.xp,hp:h.hp,sp:h.sp,equip:h.equip})),
    inv:G.inv,gold:G.gold,flags:G.flags,bestiary:G.bestiary,quests:G.quests,counters:G.counters,dread:G.dread,
    mapId:G.mapId,px:G.px,py:G.py,dir:G.dir,dayT:G.dayT,playtime:G.playtime,chapter:G.chapter,
    stamp:new Date().toLocaleString('pl-PL')};
  try{localStorage.setItem(SAVE_KEY+slot,JSON.stringify(d));return true;}catch(e){return false;}
}
function saveInfo(slot){
  try{const s=localStorage.getItem(SAVE_KEY+slot);if(!s)return null;return JSON.parse(s);}catch(e){return null;}
}
function loadGame(slot){
  const d=saveInfo(slot);if(!d)return false;
  G.party=d.party.map(p=>{const h=mkHero(p.id,p.level);h.xp=p.xp;h.equip=p.equip;h.hp=p.hp;h.sp=p.sp;return h;});
  G.inv=d.inv;G.gold=d.gold;G.flags=d.flags;G.bestiary=d.bestiary;G.quests=d.quests;
  G.counters=d.counters||{};G.dread=d.dread||0;
  G.dayT=d.dayT;G.playtime=d.playtime;G.chapter=d.chapter||'';
  setScene(Field);loadMap(d.mapId,d.px,d.py,d.dir);
  return true;
}
const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor(s/60)%60;return h+'g '+(m<10?'0':'')+m+'m';};

const STAT_LBL={hp:'ŻYW',sp:'WGR',atk:'ATK',def:'OBR',dex:'ZRC',spd:'SZB'};
const STATUS_LBL={poison:'Trucizna',bleed:'Krwawienie',burn:'Podpalenie',stun:'Ogłuszenie',fear:'Strach',regen:'Opatrzony'};
const STATUS_ICO={poison:'st_poison',bleed:'st_curse',burn:'st_burn',stun:'st_stun',fear:'st_curse',regen:'st_regen'};
class MenuScene{
  constructor(){this.overlay=true;this.tabs=['Drużyna','Przedmioty','Techniki','Ekwipunek','Bestiariusz','Dziennik','Czyny','Zapis','Opcje'];
    this.tab=0;this.focus='tabs';this.ci=0;this.sub=0;this.mode=null;this.scroll=0;this.msg=null;}
  itemList(){return Object.keys(G.inv).filter(k=>['use'].includes(ITEMS[k].type));}
  equipList(slot,hero){return Object.keys(G.inv).filter(k=>ITEMS[k].type===slot&&(!ITEMS[k].who||ITEMS[k].who===hero.id));}
  bestList(){return Object.keys(ENEMIES).filter(k=>G.bestiary[k]);}
  key(a){
    AudioSys.sfx(a==='ok'?'confirm':(a==='cancel'?'cancel':'cursor'));
    if(this.focus==='tabs'){
      if(a==='up')this.tab=(this.tab+this.tabs.length-1)%this.tabs.length;
      else if(a==='down')this.tab=(this.tab+1)%this.tabs.length;
      else if(a==='ok'){this.focus='content';this.ci=0;this.sub=0;this.mode=null;this.scroll=0;}
      else if(a==='cancel')popScene();
      return;
    }
    const t=this.tabs[this.tab];
    if(a==='cancel'){
      if(this.mode){this.mode=null;return;}
      this.focus='tabs';return;
    }
    if(t==='Drużyna'){
      if(a==='up')this.ci=Math.max(0,this.ci-1);
      if(a==='down')this.ci=Math.min(G.party.length-1,this.ci+1);
    }
    else if(t==='Przedmioty'){
      const ls=this.itemList();
      if(this.mode==='target'){
        if(a==='up')this.sub=Math.max(0,this.sub-1);
        if(a==='down')this.sub=Math.min(G.party.length-1,this.sub+1);
        if(a==='ok')this.useItem(ls[this.ci],G.party[this.sub]);
        return;
      }
      if(a==='up')this.ci=Math.max(0,this.ci-1);
      if(a==='down')this.ci=Math.min(Math.max(0,ls.length-1),this.ci+1);
      if(a==='ok'&&ls.length){
        const it=ITEMS[ls[this.ci]];
        if(it.heal||it.cure||it.spRest||it.revive){this.mode='target';this.sub=0;}
        else this.msg='Tego użyjesz tylko w walce.';
      }
    }
    else if(t==='Techniki'){
      if(this.mode==='target'){
        if(a==='up')this.sub=Math.max(0,this.sub-1);
        if(a==='down')this.sub=Math.min(G.party.length-1,this.sub+1);
        if(a==='ok')this.useSkill(this.skillSel,G.party[this.sub]);
        return;
      }
      if(this.mode==='skills'){
        const h=G.party[this.hSel],ls=skillsFor(h);
        if(a==='up')this.ci=Math.max(0,this.ci-1);
        if(a==='down')this.ci=Math.min(ls.length-1,this.ci+1);
        if(a==='ok'&&ls.length){
          const s=SKILLS[ls[this.ci]];
          if(!s.field){this.msg='Ta technika działa tylko w walce.';return;}
          if(h.sp<s.sp){this.msg='Za mało wigoru.';return;}
          this.skillSel=ls[this.ci];this.mode='target';this.sub=0;
        }
        return;
      }
      if(a==='up')this.ci=Math.max(0,this.ci-1);
      if(a==='down')this.ci=Math.min(G.party.length-1,this.ci+1);
      if(a==='ok'){this.hSel=this.ci;this.mode='skills';this.ci=0;}
    }
    else if(t==='Ekwipunek'){
      if(this.mode==='pick'){
        const h=G.party[this.hSel],ls=this.equipList(this.slotSel,h);
        if(a==='up')this.ci=Math.max(0,this.ci-1);
        if(a==='down')this.ci=Math.min(ls.length,this.ci+1); // ostatnia pozycja = zdejmij
        if(a==='ok'){
          const old=h.equip[this.slotSel];
          if(this.ci<ls.length){const id=ls[this.ci];remItem(id);h.equip[this.slotSel]=id;}
          else h.equip[this.slotSel]=null;
          if(old)addItem(old);
          h.hp=Math.min(h.hp,hstat(h,'hp'));h.sp=Math.min(h.sp,hstat(h,'sp'));
          AudioSys.sfx('chest');this.mode='slots';this.ci=0;
        }
        return;
      }
      if(this.mode==='slots'){
        if(a==='up')this.sub=Math.max(0,this.sub-1);
        if(a==='down')this.sub=Math.min(2,this.sub+1);
        if(a==='ok'){this.slotSel=['weapon','armor','acc'][this.sub];this.mode='pick';this.ci=0;}
        return;
      }
      if(a==='up')this.ci=Math.max(0,this.ci-1);
      if(a==='down')this.ci=Math.min(G.party.length-1,this.ci+1);
      if(a==='ok'){this.hSel=this.ci;this.mode='slots';this.sub=0;}
    }
    else if(t==='Bestiariusz'){
      const ls=this.bestList();
      if(a==='up')this.ci=Math.max(0,this.ci-1);
      if(a==='down')this.ci=Math.min(Math.max(0,ls.length-1),this.ci+1);
    }
    else if(t==='Dziennik'){}
    else if(t==='Czyny'){
      const n=Object.keys(ACHV).length;
      if(a==='up')this.ci=Math.max(0,this.ci-1);
      if(a==='down')this.ci=Math.min(n-1,this.ci+1);
    }
    else if(t==='Zapis'){
      if(a==='up')this.ci=Math.max(0,this.ci-1);
      if(a==='down')this.ci=Math.min(2,this.ci+1);
      if(a==='ok'){
        if(saveGame(this.ci+1)){AudioSys.sfx('levelup');this.msg='Zapisano kronikę w slocie '+(this.ci+1)+'.';}
        else this.msg='Nie udało się zapisać.';
      }
    }
    else if(t==='Opcje'){
      if(a==='up')this.ci=Math.max(0,this.ci-1);
      if(a==='down')this.ci=Math.min(3,this.ci+1);
      const adj=d=>{
        if(this.ci===0){G.opts.music=clamp(Math.round((G.opts.music+d*.1)*10)/10,0,1);AudioSys.setVol();}
        if(this.ci===1){G.opts.sfx=clamp(Math.round((G.opts.sfx+d*.1)*10)/10,0,1);AudioSys.setVol();}
        if(this.ci===2)G.opts.textSpeed=clamp(Math.round((G.opts.textSpeed+d*.5)*2)/2,.5,3);
        if(this.ci===3)G.opts.shake=!G.opts.shake;
        saveOpts();
      };
      if(a==='left')adj(-1);
      if(a==='right'||a==='ok')adj(1);
    }
  }
  useItem(id,h){
    const it=ITEMS[id];
    if(it.revive){if(h.hp>0){this.msg=HEROES[h.id].name+' trzyma się na nogach.';return;}
      h.hp=Math.max(1,Math.round(hstat(h,'hp')*it.revive));}
    else{
      if(h.hp<=0){this.msg=HEROES[h.id].name+' potrzebuje czegoś mocniejszego.';return;}
      if(it.heal)h.hp=Math.min(hstat(h,'hp'),h.hp+it.heal);
      if(it.spRest)h.sp=Math.min(hstat(h,'sp'),h.sp+it.spRest);
      if(it.cure)for(const c of it.cure)delete h.status[c];
    }
    remItem(id);AudioSys.sfx('heal');this.mode=null;
    if(!this.itemList().length)this.ci=0;
  }
  useSkill(sid,tgt){
    const s=SKILLS[sid],h=G.party[this.hSel];
    if(s.revive){if(tgt.hp>0){this.msg='Nie trzeba.';return;}tgt.hp=Math.max(1,Math.round(hstat(tgt,'hp')*s.revive));}
    else{
      if(tgt.hp<=0){this.msg='Za późno na bandaże.';return;}
      if(s.heal)tgt.hp=Math.min(hstat(tgt,'hp'),tgt.hp+Math.round(hstat(tgt,'hp')*s.heal));
      if(s.cure)for(const c of s.cure)delete tgt.status[c];
    }
    h.sp-=s.sp;AudioSys.sfx('heal');this.mode='skills';
  }
  update(){}
  drawPartyCol(x,y,sel){
    G.party.forEach((h,i)=>{
      const yy=y+i*46;
      if(sel===i){ctx.fillStyle='rgba(201,163,90,.12)';ctx.fillRect(x-4,yy-3,150,44);}
      ctx.drawImage(IMG.heroes[h.id].portrait,x,yy,28,28);
      txt(HEROES[h.id].name+'  poz.'+h.level,x+34,yy,'#f0d9a3',8);
      bar(x+34,yy+10,86,5,h.hp/hstat(h,'hp'),'#9a4438','#5e2620');
      txt(h.hp+'/'+hstat(h,'hp'),x+124,yy+8,'#b8ad98',7);
      bar(x+34,yy+19,86,5,h.sp/hstat(h,'sp'),'#3e6e52','#24402f');
      txt(h.sp+'/'+hstat(h,'sp'),x+124,yy+17,'#b8ad98',7);
      let sx=x+34;
      for(const st in h.status){if(IMG.icons[STATUS_ICO[st]]){ctx.drawImage(IMG.icons[STATUS_ICO[st]],sx,yy+26);sx+=13;}}
      if(h.hp<=0)txt('POWALONY',x+34,yy+27,'#b8453a',7);
    });
  }
  draw(){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    panel(6,6,90,H-12);
    this.tabs.forEach((t,i)=>{
      const y=16+i*20;
      if(i===this.tab){ctx.fillStyle=this.focus==='tabs'?'rgba(201,163,90,.18)':'rgba(201,163,90,.08)';ctx.fillRect(10,y-3,82,16);}
      txt(t,14,y,i===this.tab?'#f0d9a3':'#b8ad98',8);
    });
    ctx.drawImage(IMG.icons.gold,12,H-42);txt(G.gold+'',28,H-40,'#c9a35a',8);
    txt(fmtTime(G.playtime),12,H-26,'#8d8270',7);
    panel(100,6,W-106,H-12);
    const t=this.tabs[this.tab],x0=112,y0=18;
    txt(t.toUpperCase(),x0,y0-4,'#c9a35a',10);
    ctx.fillStyle='#8a7142';ctx.fillRect(x0,y0+8,W-130,1);
    const cy=y0+16;
    if(t==='Drużyna'){
      this.drawPartyCol(x0,cy,this.focus==='content'?this.ci:-1);
      const h=G.party[clamp(this.ci,0,G.party.length-1)];
      if(h){
        const dx=x0+166;
        txt(HEROES[h.id].cls,dx,cy,'#c9a35a',8);
        const ks=['atk','def','dex','spd'];
        ks.forEach((k,i)=>{txt(STAT_LBL[k],dx,cy+16+i*13,'#8d8270',8);txt(hstat(h,k)+'',dx+44,cy+16+i*13,'#e8dcc0',8);});
        txt('Doświadczenie:',dx,cy+74,'#8d8270',8);
        txt(h.xp+' / '+xpNext(h.level),dx,cy+86,'#b8ad98',8);
        bar(dx,cy+98,120,4,h.xp/xpNext(h.level),'#8a7142','#5a4a2c');
        const w_=h.equip.weapon?ITEMS[h.equip.weapon].name:'—';
        const a_=h.equip.armor?ITEMS[h.equip.armor].name:'—';
        const c_=h.equip.acc?ITEMS[h.equip.acc].name:'—';
        txt('Broń: '+w_,dx,cy+112,'#b8ad98',7);
        txt('Pancerz: '+a_,dx,cy+124,'#b8ad98',7);
        txt('Dodatek: '+c_,dx,cy+136,'#b8ad98',7);
      }
    }
    else if(t==='Przedmioty'){
      const ls=this.itemList();
      if(!ls.length)txt('Sakwy puste.',x0,cy,'#8d8270',8);
      if(this.ci>=ls.length)this.ci=Math.max(0,ls.length-1);
      ls.slice(0,11).forEach((id,i)=>{
        const it=ITEMS[id],y=cy+i*16;
        if(i===this.ci&&this.focus==='content'){ctx.fillStyle='rgba(201,163,90,.12)';ctx.fillRect(x0-4,y-2,180,15);}
        if(IMG.icons[it.icon])ctx.drawImage(IMG.icons[it.icon],x0,y);
        txt(it.name,x0+15,y+2,'#d8cdb8',8);
        txt('×'+G.inv[id],x0+168,y+2,'#8d8270',8,'right');
      });
      const id=ls[this.ci];
      if(id)wrapTxt(ITEMS[id].desc,x0+190,cy,W-x0-210,'#b8ad98',8,11);
      if(this.mode==='target'){
        panel(220,60,170,40+G.party.length*20);
        txt('Na kogo?',230,68,'#c9a35a',8);
        G.party.forEach((h,i)=>{
          if(i===this.sub){ctx.fillStyle='rgba(201,163,90,.15)';ctx.fillRect(226,82+i*20-2,158,17);}
          txt(HEROES[h.id].name,232,82+i*20,'#d8cdb8',8);
          txt(h.hp+'/'+hstat(h,'hp'),370,82+i*20,h.hp<=0?'#b8453a':'#8d8270',8,'right');
        });
      }
    }
    else if(t==='Techniki'){
      if(this.mode==='skills'||this.mode==='target'){
        const h=G.party[this.hSel],ls=skillsFor(h);
